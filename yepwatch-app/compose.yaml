# Coolify: Docker Compose from Git; base directory /; file /yepwatch-app/compose.yaml.
# Paths are relative to Coolify's explicit repository-root --project-directory.
# Local use: docker compose --project-directory . -f yepwatch-app/compose.yaml ...
# Domain on front only: https://yepwatch.com:8080 (8080 is the internal port).
x-common: &common
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "1000:1000"
  stop_grace_period: 30s
  pids_limit: 96
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  front:
    <<: *common
    build:
      context: .
      dockerfile: yepwatch-realtime/release/Dockerfile.repository
      target: front
    expose: ["8080"]
    # A fixed address for the always-on hold in goodwatch-proxy on pgnode01 (docs/yepwatch-zero-downtime-front.md):
    # while a deploy has no front running, this port refuses connections and the hold retries until it opens.
    # Private address only. Coolify removes every old container before it starts the new ones, so the port is free
    # at each deploy. Local use: YEPWATCH_FRONT_ADDRESS=127.0.0.1.
    ports: ["${YEPWATCH_FRONT_ADDRESS:-10.0.0.21}:18480:8080"]
    mem_limit: 128m
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=0700,size=32m"]
    # Starts with valkey, waiting for nothing: Caddy holds requests until api/gateway answer (lb_try_duration), and the
    # api holds early requests in its own process until it is initialized (proposal-release-main.ts).
  # Live rooms (docs/yepwatch-valkey-rooms.md). Dedicated: the shared GoodWatch cluster evicts (volatile-lfu, full).
  # noeviction + AOF everysec on a named volume Coolify keeps across deploys; no published port. The password is
  # derived from the room key (the api derives the same), so no extra secret is needed.
  valkey:
    <<: *common
    image: valkey/valkey:8.1.10
    user: "999:999"
    expose: ["6379"]
    mem_limit: 1g
    tmpfs: ["/tmp:uid=999,gid=999,mode=0700,size=1m"]
    volumes: ["valkey-data:/data"]
    environment:
      YEPWATCH_ROOMS_VALKEY_SEED: ${YEPWATCH_ROOM_KEY:?Set a stable random room key of at least 32 characters}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077;
        printf 'requirepass %s\n' "$$(printf 'yepwatch-rooms-valkey:%s' "$$YEPWATCH_ROOMS_VALKEY_SEED" | sha256sum | cut -c1-64)" > /tmp/valkey.conf;
        unset YEPWATCH_ROOMS_VALKEY_SEED;
        exec valkey-server /tmp/valkey.conf --dir /data --appendonly yes --appendfsync everysec --save ''
        --maxmemory 512mb --maxmemory-policy noeviction --protected-mode no --aof-use-rdb-preamble yes
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$(sed -n 's/^requirepass //p' /tmp/valkey.conf)\" ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
  api:
    <<: *common
    build:
      context: .
      dockerfile: yepwatch-realtime/release/Dockerfile.repository
      target: api
    expose: ["3000"]
    mem_limit: 3g
    # Started, not healthy: waiting for valkey's health check cost 2.5 s of every deploy (its 2 s interval). The api
    # reconnects on its own and answers nothing that needs the rooms before they answer. Kept as a dependency so
    # valkey is created first and so removed last (see gateway).
    depends_on:
      valkey: {condition: service_started}
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=0700,size=128m"]
    environment:
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      # No serving delay on SIGTERM. The delay is for a load balancer that keeps sending requests while it notices
      # readiness went red; here nothing can: Coolify removes the front first and starts the new containers only
      # after every old one is gone, so each second of delay was a second of yepwatch.com down on every deploy
      # (8.7 s of a ~14 s outage on 2026-11-12). In-flight requests still drain (YEPWATCH_PROPOSAL_DRAIN_MS).
      YEPWATCH_PROPOSAL_SHUTDOWN_DELAY_MS: "0"
      YEPWATCH_PROPOSAL_PUBLIC_ORIGIN: https://yepwatch.com
      YEPWATCH_PROPOSAL_ALLOWED_ORIGINS: https://yepwatch.com
      YEPWATCH_PROPOSAL_SECRET: ${YEPWATCH_ROOM_KEY:?Set a stable random room key of at least 32 characters}
      YEPWATCH_PROPOSAL_KEY_ID: ${YEPWATCH_KEY_ID:-yepwatch-first-release-01}
      YEPWATCH_PROPOSAL_GATEWAY_SECRET: ${YEPWATCH_GATEWAY_SECRET:?Set a separate random service secret of at least 32 characters}
      YEPWATCH_PROPOSAL_CRATEDB_ORIGIN: ${YEPWATCH_ROOM_ORIGIN:-http://10.0.0.11:4200}
      YEPWATCH_PROPOSAL_CRATEDB_USERNAME: ${YEPWATCH_ROOM_USER:-yepwatch_runtime}
      YEPWATCH_PROPOSAL_CRATEDB_PASSWORD: ${YEPWATCH_ROOM_PASSWORD:?Set room database password}
      YEPWATCH_PROPOSAL_ROOMS_PER_PERSON: "10"
      YEPWATCH_PROPOSAL_ADMISSIONS_PER_MINUTE: "20"
      YEPWATCH_PROPOSAL_COMMANDS_PER_MINUTE: "600"
      YEPWATCH_PROPOSAL_ACTOR_COMMANDS_PER_MINUTE: "60"
      YEPWATCH_PROPOSAL_REDIS_NODES: '[{"host":"10.0.0.14","port":6379},{"host":"10.0.0.15","port":6379},{"host":"10.0.0.16","port":6379}]'
      YEPWATCH_PROPOSAL_REDIS_USER: ${YEPWATCH_REDIS_USER:-default}
      YEPWATCH_PROPOSAL_REDIS_PASSWORD: ${YEPWATCH_REDIS_PASSWORD:?Set existing Redis password}
      # Live rooms, tickets and rate windows: the dedicated valkey service above (password derived from the room key).
      YEPWATCH_PROPOSAL_ROOMS_VALKEY_URL: redis://valkey:6379
      CRATE_HOSTS: 10.0.0.11,10.0.0.12,10.0.0.13
      CRATE_PORT: "4200"
      CRATE_USER: ${YEPWATCH_CATALOG_USER:-yepwatch_catalog}
      CRATE_PASS: ${YEPWATCH_CATALOG_PASSWORD:?Set read-only catalog database password}
      REDIS_HOST: 10.0.0.14
      REDIS_HOST2: 10.0.0.15
      REDIS_HOST3: 10.0.0.16
      REDIS_PORT: "6379"
      REDIS_USER: ${YEPWATCH_CATALOG_REDIS_USER:-${YEPWATCH_REDIS_USER:-default}}
      REDIS_PASS: ${YEPWATCH_CATALOG_REDIS_PASSWORD:-${YEPWATCH_REDIS_PASSWORD}}
      YEPWATCH_SEARCH_URL: https://goodwatch.app/api/combined-search
      YEPWATCH_SEARCH_SECRET: ${YEPWATCH_SEARCH_SECRET:-}
      YEPWATCH_MEMBER_ENABLED: ${YEPWATCH_MEMBER_ENABLED:-false}
      YEPWATCH_MEMBER_ISSUER_ORIGIN: https://goodwatch.app
      AUTH_YEPWATCH_RESOURCE: https://yepwatch.com/api/yepwatch
      AUTH_YEPWATCH_CLIENT_ID: ${YEPWATCH_GOODWATCH_CLIENT_ID:-}
      AUTH_YEPWATCH_REDIRECT_URIS: https://yepwatch.com/api/yepwatch/v1/proposal/member/callback
  gateway:
    <<: *common
    build:
      context: .
      dockerfile: yepwatch-realtime/release/Dockerfile.repository
      target: gateway
    expose: ["4311"]
    mem_limit: 512m
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=0700,size=32m"]
    environment:
      YEPWATCH_ALLOWED_ORIGINS: https://yepwatch.com
      YEPWATCH_API_ORIGIN: http://api:3000
      YEPWATCH_GATEWAY_SECRET: ${YEPWATCH_GATEWAY_SECRET}
      YEPWATCH_VALKEY_NODES: '[{"host":"10.0.0.14","port":6379},{"host":"10.0.0.15","port":6379},{"host":"10.0.0.16","port":6379}]'
      YEPWATCH_VALKEY_USER: ${YEPWATCH_REDIS_USER:-default}
      YEPWATCH_VALKEY_PASSWORD: ${YEPWATCH_REDIS_PASSWORD}
    # Created last on purpose: Coolify removes the old containers newest first (docker ps order), one by one, before it
    # starts any new one. The gateway goes first then, while the front still carries its sockets, so every phone gets
    # its "restarting" frame and close 1012 and stays quiet through the deploy (yepwatch-app core/continuous/realtime.ts,
    # PLANNED_RESTART_QUIET_MS). Removed after the front, phones would only see the connection drop (1006).
    depends_on:
      api: {condition: service_started}
      front: {condition: service_started}
volumes:
  valkey-data: {}
