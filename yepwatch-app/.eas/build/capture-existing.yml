build:
  name: Capture the existing native simulator artifact
  steps:
    - eas/checkout
    - run:
        command: |
          mkdir -p .expo/store-simulator .expo/store-captures
          curl --fail --location https://expo.dev/artifacts/eas/NWeRyF2Hf7IxqcU5KHD5unquBHkknL4nm-Hy2d8OUlk.tar.gz --output .expo/store-simulator.tar.gz
          tar -xzf .expo/store-simulator.tar.gz -C .expo/store-simulator
    - eas/install_maestro
    - run:
        command: python3 scripts/capture-apple-store.py
    - eas/upload_artifact:
        if: ${ always() }
        inputs:
          type: build-artifact
          path: '**/.expo/store-captures/**/*'
