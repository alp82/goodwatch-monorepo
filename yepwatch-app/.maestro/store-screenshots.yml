# Actual native UI and a disposable guest room; no account or private invitation is captured.
appId: com.yepwatch.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: New room
    timeout: 90000
- takeScreenshot: 01-choose-together
- tapOn: New room
- extendedWaitUntil:
    visible: Anything goes
    timeout: 45000
- tapOn: Anything goes
- extendedWaitUntil:
    visible: Your name
    timeout: 45000
- tapOn: Your name
- inputText: Alex
- hideKeyboard
- tapOn: Start
- extendedWaitUntil:
    visible: Your services
    timeout: 15000
- takeScreenshot: 02-your-services
- tapOn: Netflix
- tapOn: Prime Video
- tapOn: Disney+
- tapOn: Done
- tapOn: Start
- extendedWaitUntil:
    visible: Yep
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: 03-find-your-pick
- tapOn: Yep
- tapOn: Matches.*
- waitForAnimationToEnd
- takeScreenshot: 04-your-matches
