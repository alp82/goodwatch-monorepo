# iOS share of the pre-OTA gate on EAS Workflows. Started only by `node e2e/ci/ota-gate.mjs --ios` (or by hand):
#   cd yepwatch-app && npx eas-cli@latest workflow:run e2e/native/ci/eas-maestro-ios.yml --non-interactive
# Never runs on push (workflow_dispatch only), never publishes anything.
#
# Pieces (https://docs.expo.dev/eas/workflows/pre-packaged-jobs/, /examples/e2e-tests/, /build-reference/simulators/):
# 1. `type: build` with the eas.json profile `e2e-ios-simulator`: a Release iOS *simulator* build
#    (ios.simulator, withoutCredentials). APP_VARIANT=development keeps app.json's config (no OTA url, so the
#    build can never pick up a published update) and its EXPO_PUBLIC_* origins point at loopback 19100/19200/
#    19300, where the native dev stack listens. Nothing in that build knows yepwatch.com's API.
# 2. `type: maestro` on macOS with that build. The hermetic stack runs inside the same VM, started by the
#    job's before_maestro_tests hook (the simulator shares the VM's loopback): the native dev stack
#    (e2e/native/stack/dev-stack.mjs --no-docker: in-memory rooms, synthetic catalog, Valkey from Homebrew,
#    env -i allowlist + loopback-only socket preload). The shared Docker stack can't run there (no Docker on
#    EAS macOS VMs).
#    The hook also refuses to test a build whose bundle carries the production realtime origin, and points the
#    production hosts at 0.0.0.0 in /etc/hosts as a second fence.
# 3. One flow, e2e/ci/maestro-ios-journey.yaml: create → start → vote → details → rapid taps → kill/relaunch.
#
# iOS differences from Android: no Back button (back-priority is Android only), universal links can't verify on
# a simulator (invitation entry is Android-only coverage), timing/flash/frame gates are Android-only (they read
# the emulator's 60 fps recorder); iOS gives pass/fail journeys. Maestro jobs are marked alpha by Expo.
name: YepWatch iOS E2E (before OTA)

on:
  workflow_dispatch: {}

jobs:
  build_ios_e2e:
    name: Release simulator build (loopback origins)
    type: build
    params:
      platform: ios
      profile: e2e-ios-simulator

  maestro_ios:
    name: Maestro journey on the iOS simulator
    needs: [build_ios_e2e]
    type: maestro
    runs_on: macos-medium
    environment: development
    env:
      MAESTRO_APP_ID: dev.yepwatch.foundation
      MAESTRO_CLI_NO_ANALYTICS: '1'
    params:
      build_id: ${{ needs.build_ios_e2e.outputs.build_id }}
      flow_path: e2e/ci/maestro-ios-journey.yaml
      record_screen: true
      retries: 0
      device_identifier:
        ios: iPhone 16
    hooks:
      before_maestro_tests:
        - name: Fence off production hosts
          run: |
            sudo sh -c 'printf "0.0.0.0 yepwatch.com www.yepwatch.com goodwatch.app www.goodwatch.app\n" >> /etc/hosts' || echo "could not edit /etc/hosts; the build's loopback origins still apply"
        - name: Refuse a build that points at production
          run: |
            app=$(find "$HOME" /tmp -maxdepth 6 -name '*.app' -path '*Build*' 2>/dev/null | head -1)
            if [ -n "$app" ] && grep -rqa 'wss://yepwatch.com' "$app"; then
              echo "The E2E build embeds the production realtime origin; refusing to run against it"; exit 1
            fi
            echo "checked ${app:-no .app found (skipped)}"
        - name: Install the stack's dependencies
          run: |
            npm ci --install-links --no-audit --no-fund
            (cd ../goodwatch-webapp && npm ci --ignore-scripts --no-audit --no-fund && npx patch-package)
            (cd ../yepwatch-realtime && npm ci --no-audit --no-fund && npm run build)
        - name: Start the hermetic stack on loopback
          run: |
            brew install valkey
            valkey-server --port 19379 --bind 127.0.0.1 --save '' --appendonly no --daemonize yes
            node e2e/native/stack/dev-stack.mjs up --no-docker
      after_maestro_tests:
        - name: Stack logs
          run: |
            tail -n 80 e2e/native/.cache/dev-stack/*.log || true
            node e2e/native/stack/dev-stack.mjs down || true
