summary: ''
description: Crawl multiple Rotten Tomatoes pages by id
value:
  modules:
    - id: a
      value:
        type: script
        input_transforms:
          next_ids:
            type: javascript
            expr: flow_input.next_ids
        path: f/rotten_web/rotten_tomatoes_crawl_ratings/iterate
        tag_override: null
      continue_on_error: false
      timeout:
        type: static
        value: 300
    - id: b
      value:
        type: forloopflow
        modules:
          - id: c
            value:
              type: script
              input_transforms:
                next_id:
                  type: javascript
                  expr: flow_input.iter.value
              path: f/rotten_web/rotten_tomatoes_crawl_ratings/fetch
              tag_override: null
            # No retries: a block is recorded and reported, never retried through (#152).
            # A show with many scored seasons takes one request every 2 s per season page.
            timeout:
              type: static
              value: 180
        iterator:
          type: javascript
          expr: results.a
        parallel: false
        skip_failures: true
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    next_ids:
      type: object
      description: ''
      default: null
      format: resource-dic
      properties: {}
  required:
    - next_ids
