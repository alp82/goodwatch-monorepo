summary: Read the big brands' service lists daily
description: >-
  Proposed schedule 14:00 UTC daily. Fresh discover reads with completeness
  gates, fresh per-title confirmation, and shared availability-history precision
  rules. Dry runs take only an operational Mongo run lease; history reads use
  SELECT. Never writes streaming_availability.
value:
  modules:
    - id: lists
      value:
        path: f/tmdb_api/daily_provider_lists
        type: script
        input_transforms:
          dry_run:
            expr: flow_input.dry_run
            type: javascript
          countries:
            expr: flow_input.countries
            type: javascript
          service_ids:
            expr: flow_input.service_ids
            type: javascript
          max_requests:
            expr: flow_input.max_requests
            type: javascript
          requests_per_second:
            expr: flow_input.requests_per_second
            type: javascript
          baseline_max_requests:
            expr: flow_input.baseline_max_requests
            type: javascript
          baseline_max_memberships:
            expr: flow_input.baseline_max_memberships
            type: javascript
      timeout:
        type: static
        value: 28800
    - id: report
      value:
        lock: '!inline report.inline_script.lock'
        type: rawscript
        content: '!inline report.inline_script.py'
        language: python3
        input_transforms:
          report:
            expr: results.lists
            type: javascript
  concurrent_limit: 1
  concurrency_time_window_s: 0
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    countries:
      type: array
      items:
        type: string
      description: Omit for every current and previously monitored country.
    service_ids:
      type: array
      items:
        type: integer
      description: Omit for the research's 15 service IDs. Can widen later.
    dry_run:
      type: boolean
      default: true
    requests_per_second:
      type: number
      default: 15
      exclusiveMinimum: 0
      maximum: 20
    baseline_max_requests:
      type: integer
      default: 120000
      minimum: 0
      description: Maximum HTTP requests for new countries after checkpoint rereads.
    baseline_max_memberships:
      type: integer
      default: 570000
      minimum: 0
      description: Maximum new title/list checks; failed lists do not block siblings.
    max_requests:
      type: integer
      default: 350000
      minimum: 1
      maximum: 350000
  required: []
