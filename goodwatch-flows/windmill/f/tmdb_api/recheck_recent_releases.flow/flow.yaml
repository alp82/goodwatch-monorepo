summary: Recheck offers for recent releases daily
description: >-
  Run at 13:00 UTC; TMDB's update time is unconfirmed. Select recent and upcoming
  premieres and digital movie releases, fetch fresh through the existing details script, and let the regular streaming
  publication write offers. Does not reserve or advance the 30-day details cycle.
value:
  modules:
    - id: select
      value:
        type: script
        path: f/tmdb_api/recent_releases
        input_transforms: {}
      timeout: 300
    - id: fetch
      value:
        type: forloopflow
        iterator:
          type: javascript
          expr: results.select.batches
        parallel: false
        skip_failures: true
        modules:
          - id: batch
            value:
              type: script
              path: f/tmdb_api/tmdb_fetch_details_from_api/fetch
              input_transforms:
                bypass_cache:
                  type: static
                  value: true
                next_ids:
                  type: javascript
                  expr: flow_input.iter.value
            retry:
              constant:
                attempts: 2
                seconds: 60
            timeout: 300
    - id: report
      value:
        type: rawscript
        language: python3
        lock: ''
        input_transforms:
          plan:
            type: javascript
            expr: results.select
          batches:
            type: javascript
            expr: results.fetch
        content: '!inline report.inline_script.py'
  concurrent_limit: 1
  concurrency_time_window_s: 0
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties: {}
  required: []
