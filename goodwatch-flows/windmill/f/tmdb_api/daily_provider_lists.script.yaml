summary: Read daily service lists into availability history
description: >-
  Fresh, completeness-gated discover with per-title checks. Dry run by default;
  only operational Mongo leases in dry runs; never writes
  streaming_availability.
lock: '!inline f/tmdb_api/daily_provider_lists.script.lock'
concurrency_time_window_s: 0
concurrent_limit: 1
kind: script
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  properties:
    countries:
      type: array
      items:
        type: string
    dry_run:
      type: boolean
      default: true
    max_requests:
      type: integer
      default: 350000
      minimum: 1
    requests_per_second:
      type: number
      default: 15
      exclusiveMinimum: 0
      maximum: 20
    service_ids:
      type: array
      items:
        type: integer
  required: []
timeout: 28800
