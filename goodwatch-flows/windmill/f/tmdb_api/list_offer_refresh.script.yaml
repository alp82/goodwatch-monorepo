summary: Refresh and publish titles whose daily-list offers disagree
description: >-
  Durable per-title retries through the shared streaming and vector publishers.
  Preview by default; only explicit dry_run=false writes. Live calls share the
  daily list run lease. No details-queue reservations or country scrape requests.
lock: '!inline f/tmdb_api/list_offer_refresh.script.lock'
kind: script
concurrent_limit: 1
concurrency_time_window_s: 0
timeout: 28800
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    dry_run:
      type: boolean
      default: true
    max_requests:
      type: integer
      default: 350000
      minimum: 1
      maximum: 350000
    preview_offers:
      type: boolean
      default: false
      description: Read fresh TMDB and show exact offer/history diffs; SELECT/find only, requires dry_run=true.
    limit:
      type: integer
      default: 20000
      minimum: 1
      maximum: 20000
  required: []
