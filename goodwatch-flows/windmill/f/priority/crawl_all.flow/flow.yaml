summary: Crawl all data sources for prioritized movies and tv shows and update database
description: Crawl all data sources for prioritized movies and tv shows and update database
value:
  modules:
    - id: g
      value:
        type: script
        input_transforms:
          movie_tmdb_id:
            type: javascript
            expr: flow_input.movie_tmdb_id
          tv_tmdb_id:
            type: javascript
            expr: flow_input.tv_tmdb_id
        path: f/priority/next
        tag_override: null
    - id: i
      timeout:
        type: static
        value: 600
      value:
        type: script
        input_transforms:
          next_ids:
            type: javascript
            expr: results.g.ids
        path: f/tmdb_api/tmdb_fetch_details_from_api/fetch
        tag_override: null
      continue_on_error: false
      retry:
        constant:
          attempts: 0
          seconds: 0
        exponential:
          attempts: 5
          multiplier: 1
          random_factor: 0
          seconds: 2
    - id: b
      timeout:
        type: static
        value: 1800
      summary: ''
      value:
        type: branchall
        branches:
          - summary: IMDB
            modules:
              - id: 'n'
                skip_if:
                  expr: '!flow_input.crawl_imdb'
                value:
                  type: script
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.g.ids
                  path: f/imdb_web/imdb_init_ratings/update
                  tag_override: null
                continue_on_error: false
                retry:
                  constant:
                    attempts: 0
                    seconds: 0
                  exponential:
                    attempts: 5
                    multiplier: 1
                    random_factor: 0
                    seconds: 2
              - id: x
                skip_if:
                  expr: '!flow_input.crawl_imdb'
                value:
                  type: flow
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.n
                  path: f/imdb_web/crawl_all_by_id
                continue_on_error: false
                timeout:
                  type: static
                  value: 300
            expr: ''
            parallel: true
            skip_failure: false
          - summary: Metacritic
            modules:
              - id: m
                value:
                  type: script
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.g.ids
                  path: f/metacritic_web/metacritic_init_ratings/update
                  tag_override: null
                continue_on_error: false
                retry:
                  constant:
                    attempts: 0
                    seconds: 0
                  exponential:
                    attempts: 5
                    multiplier: 1
                    random_factor: 0
                    seconds: 2
              - id: w
                value:
                  type: flow
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.m
                  path: f/metacritic_web/crawl_all_by_id
                continue_on_error: false
                timeout:
                  type: static
                  value: 300
            expr: ''
            parallel: true
            skip_failure: false
          - summary: Rotten Tomatoes
            modules:
              - id: l
                value:
                  type: script
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.g.ids
                  path: f/rotten_web/rotten_tomatoes_init_ratings/update
                  tag_override: null
                continue_on_error: false
                retry:
                  constant:
                    attempts: 0
                    seconds: 0
                  exponential:
                    attempts: 5
                    multiplier: 1
                    random_factor: 0
                    seconds: 2
              - id: t
                value:
                  type: flow
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.l
                  path: f/rotten_web/crawl_all_by_id
                continue_on_error: false
                timeout:
                  type: static
                  value: 300
            expr: ''
            parallel: true
            skip_failure: false
          - summary: TV Tropes
            modules:
              - id: k
                value:
                  type: script
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.g.ids
                  path: f/tvtropes_web/tvtropes_init_tags/update
                  tag_override: null
                continue_on_error: false
                retry:
                  constant:
                    attempts: 0
                    seconds: 0
                  exponential:
                    attempts: 5
                    multiplier: 1
                    random_factor: 0
                    seconds: 2
              - id: v
                value:
                  type: flow
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.k
                  path: f/tvtropes_web/crawl_all_by_id
                continue_on_error: false
                timeout:
                  type: static
                  value: 300
            expr: ''
            parallel: true
            skip_failure: false
          - summary: TMDB Streaming
            modules:
              - id: j
                value:
                  type: script
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.g.ids
                  path: f/tmdb_web/tmdb_init_providers/update
                  tag_override: null
                continue_on_error: false
                retry:
                  constant:
                    attempts: 0
                    seconds: 0
                  exponential:
                    attempts: 5
                    multiplier: 1
                    random_factor: 0
                    seconds: 2
              - id: u
                value:
                  type: flow
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.j
                  path: f/tmdb_web/crawl_all_by_id
                continue_on_error: false
                timeout:
                  type: static
                  value: 300
            expr: ''
            parallel: true
            skip_failure: false
          - summary: Fingerprint
            modules:
              - id: aa
                value:
                  type: script
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.g.ids
                  path: f/dna/init/update
              - id: ab
                value:
                  type: flow
                  input_transforms:
                    next_ids:
                      type: javascript
                      expr: results.aa
                  path: f/dna/crawl_all_by_id
              - id: ac
                value:
                  type: script
                  input_transforms:
                    ids:
                      type: javascript
                      expr: results.aa
                    results:
                      type: javascript
                      expr: results.ab
                  path: f/dna/generate/vectors
            expr: ''
            parallel: true
            skip_failure: true
        parallel: true
    - id: o
      timeout:
        type: static
        value: 600
      summary: Publish crawled titles to CrateDB
      value:
        type: script
        input_transforms:
          next_ids:
            type: javascript
            expr: results.g.tmdb_ids
        path: f/priority/publish
      continue_on_error: false
    - id: 'y'
      value:
        type: script
        input_transforms:
          claims:
            type: javascript
            expr: results.g.claims
          publication_result:
            type: javascript
            expr: results.o
        path: f/priority/reset
        tag_override: null
  concurrency_time_window_s: 0
schema:
  $schema: 'https://json-schema.org/draft/2020-12/schema'
  type: object
  order:
    - movie_tmdb_id
    - tv_tmdb_id
    - crawl_imdb
  properties:
    crawl_imdb:
      type: boolean
      description: >-
        Crawl imdb.com pages. Off because imdb.com blocks the crawler; IMDb
        ratings come from the daily dataset files instead.
      default: false
    movie_tmdb_id:
      type: string
      description: ''
      default: ''
      format: ''
      password: false
    tv_tmdb_id:
      type: string
      description: ''
      default: ''
      format: ''
      password: false
  required: []
