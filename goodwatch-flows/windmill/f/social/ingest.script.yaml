summary: Social ingest
description: Bounded discovery/backfill; sources fail independently, all accepted
  matches publish.
lock: '!inline f/social/ingest.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    days:
      type: integer
      default: 2
      maximum: 30
      minimum: 1
    max_posts:
      type: integer
      default: 400
      maximum: 10000
      minimum: 1
    pages:
      type: integer
      default: 2
      maximum: 18
      minimum: 1
    source:
      type: string
      default: all
      enum:
      - all
      - youtube
      - rss
      - bluesky
      - mastodon
    vector_enabled:
      type: boolean
      default: true
  required: []
concurrent_limit: 1
concurrency_time_window_s: 0
