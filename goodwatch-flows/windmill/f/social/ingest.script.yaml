{
  "summary": "Social ingest",
  "description": "Bounded discovery/backfill; sources fail independently, all accepted matches publish.",
  "lock": "!inline f/social/ingest.script.lock",
  "kind": "script",
  "schema": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "type": "object",
    "properties": {
      "source": {
        "type": "string",
        "enum": [
          "all",
          "youtube",
          "rss",
          "bluesky",
          "mastodon"
        ],
        "default": "all"
      },
      "days": {
        "type": "integer",
        "minimum": 1,
        "maximum": 30,
        "default": 2
      },
      "pages": {
        "type": "integer",
        "minimum": 1,
        "maximum": 18,
        "default": 2
      },
      "max_posts": {
        "type": "integer",
        "minimum": 1,
        "maximum": 10000,
        "default": 400
      },
      "vector_enabled": {
        "type": "boolean",
        "default": true
      }
    },
    "required": []
  }
}
