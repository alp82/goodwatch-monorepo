{
  "summary": "Remove deleted and opted-out social posts",
  "description": "Schedules are enabled after merge; see docs/implementation/talked-about-now/social.md.",
  "value": {
    "modules": [
      {
        "id": "run",
        "value": {
          "type": "script",
          "path": "f/social/maintenance",
          "input_transforms": {
            "limit": {
              "type": "javascript",
              "expr": "flow_input.limit"
            },
            "source": {
              "type": "javascript",
              "expr": "flow_input.source"
            }
          }
        },
        "timeout": {
          "type": "static",
          "value": 7200
        }
      }
    ]
  },
  "schema": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "type": "object",
    "properties": {
      "limit": {
        "type": "integer",
        "minimum": 1,
        "maximum": 10000,
        "default": 2000
      },
      "source": {
        "type": "string",
        "enum": [
          "all",
          "youtube",
          "rss",
          "bluesky",
          "mastodon"
        ],
        "default": "all"
      }
    },
    "required": []
  }
}
