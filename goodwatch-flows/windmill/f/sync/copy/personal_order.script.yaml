summary: Build Personal order ordering components for eligible rollout members
description: Reads shared Crate inputs once, then publishes gzip format-1 JSON to personal-order:v1:<member> with a 48-hour TTL, or deletes selected ineligible payloads. Authorizes cohort ids or all against f/sync/personal_order_members. Dirty runs claim personal-order:dirty and requeue failures. Snapshot/nightly runs reconcile the whole rollout. All builds share this script concurrency limit.
kind: script
concurrent_limit: 1
concurrency_time_window_s: 0
lock: '!inline f/sync/copy/personal_order.script.lock'
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - member_ids
    - ttl_seconds
    - dry_run
    - dirty_only
  properties:
    member_ids:
      oneOf:
        - type: array
          items:
            type: string
          uniqueItems: true
        - type: string
          enum: [all]
      description: Omitted or null uses f/sync/personal_order_members. Explicit ids must be in that rollout; all requires an all rollout.
    ttl_seconds:
      type: integer
      minimum: 1
      default: 172800
    dry_run:
      type: boolean
      default: true
      description: Read and compute but write nothing, including no locks.
    dirty_only:
      type: boolean
      default: false
      description: Claim personal-order:dirty and rebuild only selected rollout members. Dry runs inspect without popping.
timeout: 1800
