summary: Publish the title snapshot to Redis
description: >-
  Publishes analysed titles from Crate as format 1 in Redis. The current manifest
  points to the version's checksummed chunks and optional ratings, facts and
  original-language sidecars. Keeps the current and previous versions. Publishes
  when analysis or TMDB details change, or when the language sidecar is missing.
  Runs after scheduled vector copies, nightly, and on demand. Successful publish
  and no-change runs enqueue personal order for the configured rollout via
  personal_order_trigger. Dry runs write nothing and never enqueue.
lock: '!inline f/sync/copy/title_snapshot.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - force
    - dry_run
  properties:
    dry_run:
      type: boolean
      description: Read and encode the snapshot and report it, but write nothing.
      default: false
    force:
      type: boolean
      description: Publish even when no title analysis changed.
      default: false
  required: []
timeout: 1800
