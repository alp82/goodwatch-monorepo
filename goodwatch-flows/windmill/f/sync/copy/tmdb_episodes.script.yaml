summary: Copy TMDB episodes to CrateDB
description: Bring the episode table in line with the seasons fetched since the last run
lock: '!inline f/sync/copy/tmdb_episodes.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    tmdb_ids:
      type: array
      description: Copy only these shows and leave the checkpoint alone
      default: []
      items:
        type: integer
      originalType: integer[]
    max_seconds:
      type: integer
      description: Stop taking new batches after this long
      default: 240
  required: []
