summary: Crawl TMDB pages to get streaming provider data
description: Crawl TMDB pages to get streaming provider data and persist it.
value:
  modules:
  - id: a
    value:
      type: script
      input_transforms:
        availability_selection:
          type: javascript
          expr: flow_input.availability_selection
      path: f/tmdb_web/tmdb_crawl_providers/next
      tag_override: null
    continue_on_error: false
    retry:
      constant:
        attempts: 0
        seconds: 0
      exponential:
        attempts: 3
        multiplier: 1
        random_factor: 0
        seconds: 2
    timeout:
      type: static
      value: 300
  - id: b
    value:
      type: flow
      input_transforms:
        next_ids:
          type: javascript
          expr: results.a
        publication_enabled:
          type: javascript
          expr: flow_input.publication_enabled ?? !flow_input.availability_selection
        shadow_selection:
          type: javascript
          expr: flow_input.shadow_selection ?? flow_input.availability_selection
      path: f/tmdb_web/crawl_all_by_id
    continue_on_error: false
    retry:
      constant:
        attempts: 0
        seconds: 0
      exponential:
        attempts: 3
        multiplier: 1
        random_factor: 50
        seconds: 2
    timeout:
      type: static
      value: 600
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    availability_selection:
      type: boolean
      default: false
    publication_enabled:
      type: boolean
    shadow_selection:
      type: boolean
  required: []
