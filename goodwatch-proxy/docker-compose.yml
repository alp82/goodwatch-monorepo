x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"

services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      # Keep the private address available for private/docker-compose.yml.
      - "128.140.87.34:80:80/tcp"
      - "128.140.87.34:443:443/tcp"
      - "[2a01:4f8:c17:d25::1]:80:80/tcp"
      - "[2a01:4f8:c17:d25::1]:443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
