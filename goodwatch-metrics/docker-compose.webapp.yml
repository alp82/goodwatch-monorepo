# Use only on hosts that run a webapp instance (abio, vector1), where Coolify supplies the goodwatch-webapp network
# alias on the coolify network. Each host's Alloy scrapes its own instance.
# docker compose -f docker-compose.yml -f docker-compose.webapp.yml up -d grafana-alloy
services:
  grafana-alloy:
    volumes:
      - ./webapp.alloy:/etc/alloy/webapp.alloy:ro
    command: run /etc/alloy/
    networks:
      - default
      - coolify

networks:
  coolify:
    external: true
