x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "10"

# One Valkey cluster node. main/ runs on cache1 and replica/ on cache2 and cache3.
# All three are masters: the directory and service names are historical and set the
# Compose project, container, and volume names, so they stay.
# Keep this file identical in main/ and replica/ except for the service name.
# Nothing here creates or resets a cluster: the node reads nodes.conf from its volume.
services:
  redis-replica:
    image: valkey/valkey:8.1.10@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
    restart: unless-stopped
    # The data volume was written by the Bitnami image as user 1001, group 0.
    user: "1001:0"
    # A shutdown writes an RDB file first (about 30 seconds for 5 GB).
    stop_grace_period: 5m
    volumes:
      - redis-data:/data
      - ../valkey.conf:/etc/valkey/valkey.conf:ro
    network_mode: host
    environment:
      - 'REDIS_PRIVATE_IP=${REDIS_PRIVATE_IP:?Set the node private address (10.0.0.14-16)}'
      - 'REDIS_PASSWORD=${REDIS_PASSWORD:?Set the cluster password}'
    logging: *default-logging
    # The shell reads the address and the password from the container's environment
    # ($$ keeps Compose from expanding them), so the password isn't in the command.
    command:
      - sh
      - -c
      - >-
        exec valkey-server /etc/valkey/valkey.conf
        --cluster-announce-ip "$$REDIS_PRIVATE_IP"
        --requirepass "$$REDIS_PASSWORD"
        --masterauth "$$REDIS_PASSWORD"

volumes:
  redis-data:
    driver: local
