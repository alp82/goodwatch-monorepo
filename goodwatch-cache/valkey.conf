# Valkey configuration shared by all cache nodes (cache1 to cache3).
# Mounted read-only at /etc/valkey/valkey.conf by main/ and replica/ docker-compose.yml.
# Per-node and secret values are not in this file: the Compose command passes
# --cluster-announce-ip, --requirepass, and --masterauth from the host's .env file.
# The mount is read-only, so CONFIG REWRITE fails on purpose. Change this file,
# then recreate one node at a time (docs/private-redis.md).

bind * -::*
port 6379
protected-mode yes

# Data volume. These names match what the earlier Bitnami Redis 7.2 image wrote,
# so a node keeps its identity (nodes.conf), slots, and data.
dir /data
dbfilename dump.rdb
appendonly yes
appenddirname appendonlydir
appendfilename appendonly.aof
appendfsync everysec

cluster-enabled yes
cluster-config-file nodes.conf
cluster-announce-port 6379
cluster-announce-bus-port 16379

# Decided settings: docs/adr/0003-redis-cluster-of-masters-with-volatile-lfu.md.
maxmemory 7gb
maxmemory-policy volatile-lfu
cluster-require-full-coverage no
# The cluster has no replicas by decision. With the default (yes), a master that gives away its last slot turns itself
# into a replica of the receiver and loads a full copy, past its own maxmemory (docs/redis-add-node.md). Takes effect
# when a node's container is recreated: a running node needs CONFIG SET, which is the owner's step.
cluster-allow-replica-migration no

# Reply buffers count toward maxmemory, so a client that reads too slowly must not
# hold them without a limit. A normal client is disconnected at 64 MB of pending
# replies, or when it stays above 32 MB for 10 seconds. The largest legitimate burst
# is a starting webapp that asks for one title snapshot version at once: up to 15 MB
# per node. The replica and pubsub classes keep their defaults (docs/private-redis.md).
client-output-buffer-limit normal 64mb 32mb 10
