<!doctype html>
<!-- THROWAWAY: previews of the proposed shared dialog, inline quiz and TV quiz. Open directly; no backend or persistence. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoodWatch · scoring previews</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1016;color:#f5f5f4;font:15px system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit;border:0}header{padding:30px 38px 22px}header small{color:#fbbf24;text-transform:uppercase;letter-spacing:2px;font-size:11px}h1{font-size:29px;margin:9px 0}header p{color:#a8a8b0;margin:0}.board{display:grid;grid-template-columns:minmax(600px,1fr) 390px;gap:26px;margin:0 38px}.label{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:1.8px;margin:0 0 12px}.device{height:650px;border:1px solid #ffffff25;border-radius:20px;overflow:hidden;position:relative;background:#131820}.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid #ffffff10;font-size:13px;color:#aaa}.logo{color:white;font-weight:850;font-size:20px;letter-spacing:-1px}.logo b{color:#fbbf24}.scene{background:radial-gradient(ellipse at 75% 0%,#9b69345c,transparent 70%),linear-gradient(140deg,#292c30,#10141b);height:100%;position:relative}.background{padding:65px 38px}.background h2{font-size:46px;margin:12px 0}.muted{color:#a8a8b0}.tag{font-size:11px;letter-spacing:2px;font-weight:700;color:#c9ad87}.pill{display:inline-block;border:1px solid #ffffff30;background:#ffffff08;padding:11px 16px;border-radius:10px;margin-top:25px}.scrim{position:absolute;inset:0;background:#0008}.panel{position:absolute;top:270px;left:38px;width:calc(100% - 76px);max-width:680px;padding:25px;background:#22201f;border:1px solid #ffffff25;border-radius:20px;box-shadow:0 24px 60px #0009}.panel h3{font-size:20px;margin:0}.titleline{display:flex;align-items:center;justify-content:space-between;gap:15px}.close{background:#ffffff09;border-radius:50%;width:32px;height:32px}.seen{color:#8bc98e;font-size:12px}.status{display:flex;justify-content:space-between;align-items:center;color:#aaa;font-size:13px;margin:23px 0 14px}.status strong{color:#73ca7c}.clear{color:#aaa;background:none;text-decoration:underline;font-size:12px}.picker{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}.level{height:70px;border-radius:10px;background:#343333;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;border-top:3px solid var(--c);gap:8px}.level small{white-space:nowrap;font-size:10px;color:#aaa;font-weight:500}.number{height:46px;border-radius:7px;font-weight:750;background:color-mix(in srgb,var(--c) 30%,#20201f);color:#eee}.number.selected{background:var(--c);color:#101510;outline:2px solid white;outline-offset:2px}.level.selected{background:color-mix(in srgb,var(--c) 35%,#22201f);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 70%,white)}.footer{font-size:12px;color:#aaa;margin-top:22px;display:flex;justify-content:space-between}.grip{display:none}.phone .nav{padding:18px}.phone .background{padding:50px 22px}.phone .background h2{font-size:34px}.phone .panel{left:0;top:auto;bottom:0;width:100%;border-radius:24px 24px 0 0;padding:14px 15px 28px}.phone .grip{display:block;width:35px;height:4px;background:#666;border-radius:5px;margin:0 auto 20px}.phone .panel h3{font-size:18px}.phone .picker{gap:4px}.phone .level{font-size:12px;height:57px;gap:0}.phone .level small{display:none}.phone .number{height:46px;font-size:13px}.phone .status{font-size:12px}.quiz{padding:35px}.quiz .tag{color:#e6bf74}.quiz h2{font-size:43px;letter-spacing:-1px;margin:16px 0 8px}.quiz .art{height:110px;background:radial-gradient(ellipse at 65% 25%,#bd9e7277,transparent 60%),linear-gradient(135deg,#4b4938,#1c2831);border-radius:14px;margin-bottom:28px;position:relative;overflow:hidden}.art:after{content:'';position:absolute;width:400px;height:160px;background:#101a22;transform:rotate(-15deg);left:30%;top:95px;border-radius:45%}.quiz .question{font-size:18px;margin:25px 0 17px;font-weight:700}.quiz .status{margin:16px 0}.secondary{background:#ffffff08;border:1px solid #ffffff20;border-radius:20px;padding:10px 18px;color:#ccc;font-size:12px}.quiz .footer{align-items:center}.phone .quiz{padding:24px 16px}.phone .quiz h2{font-size:31px}.phone .quiz .art{height:150px;margin-bottom:25px}.phone .quiz .question{font-size:17px;margin-top:28px}.tvwrap{padding:32px 24px;background:linear-gradient(120deg,#322b29,#181b25);height:100%}.tv{border:9px solid #08090b;border-radius:14px;background:radial-gradient(ellipse at 80% 15%,#95805f66,transparent 70%),#171c23;padding:34px 30px 27px;box-shadow:0 20px 35px #0007}.tv h2{font-size:39px;margin:20px 0 8px;letter-spacing:-1px}.tv .status{margin:28px 0 17px}.tv .level{height:68px}.tv .level.selected{outline:2px solid #ffffffcc;outline-offset:3px}.tv .footer{align-items:center}.remote{margin:24px auto 0;width:max-content;padding:13px 22px;border-radius:25px;background:#11151b;border:1px solid #ffffff25;color:#aab0bd;font-size:12px}.phone .tvwrap{padding:22px 12px}.phone .tv{padding:22px 12px;border-width:5px}.phone .tv h2{font-size:29px;line-height:1.1;margin-top:32px}.phone .tv .status{margin-top:36px}.phone .tv .level{height:58px}.phone .tv .footer{flex-wrap:wrap;gap:12px}.phone .remote{font-size:11px;padding:13px}.note{padding:20px 38px;color:#a4a9b4;font-size:13px}.switch{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:17px;background:#fbbf24;color:#18140a;border-radius:40px;padding:9px 18px;box-shadow:0 8px 28px #0006;font-size:12px;font-weight:750}.switch button{background:transparent;color:#18140a;font-size:20px}button:focus-visible{outline:2px solid #fbbf24;outline-offset:3px}@media(max-width:1000px){.board{grid-template-columns:1fr;margin:0 18px}.phone{max-width:390px}.desktop{display:none}header{padding:24px 18px}.note{padding:20px 18px}}

.number.selected{color:#fff;background:color-mix(in srgb,var(--c) 42%,#181b20);outline:0}
[data-treatment="ring"] .number.selected{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 70%,white)}
[data-treatment="underline"] .number.selected{box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c) 70%,white);background:#3a3633}
[data-treatment="raised"] .number.selected{transform:translateY(-3px);box-shadow:inset 0 0 0 1px #ffffffb0,0 5px 0 #080b0d,0 7px 12px #0005;background:color-mix(in srgb,var(--c) 42%,#181b20)}
.number:focus-visible{outline:2px solid #fbbf24;outline-offset:3px}
.treatments{margin:16px 38px;display:flex;gap:8px;flex-wrap:wrap}.treatments button{border-radius:25px;background:#272b32;padding:10px 15px;font-size:13px}.treatments button[aria-pressed="true"]{background:#fafaf9;color:#18181b}
</style>
<header><small>GoodWatch · Design preview</small><h1 id="heading"></h1><p id="intro"></p></header><div class="treatments"><button onclick="treat('ring')">A · Colored rim</button><button onclick="treat('underline')">B · Underline</button><button onclick="treat('raised')">C · Raised key</button></div><main class="board"><section class="desktop"><p class="label">Desktop · spacious controls</p><div class="device" id="desktop"></div></section><section class="phone"><p class="label">Phone · all ten numbers remain visible</p><div class="device" id="phone"></div></section></main><div class="note" id="note"></div><nav class="switch"><button onclick="cycle(-1)" aria-label="Previous preview">←</button><span id="current"></span><button onclick="cycle(1)" aria-label="Next preview">→</button></nav>
<script>
const variants=['dialog','quiz','tv'];let variant=new URLSearchParams(location.search).get('variant')||'dialog';let score=7;let treatment=new URLSearchParams(location.search).get('treatment')||'ring';function treat(t){treatment=t;const u=new URL(location.href);u.searchParams.set('treatment',t);history.replaceState(null,'',u);render()}function applyTreatment(){document.body.dataset.treatment=treatment;document.querySelectorAll('.treatments button').forEach((b,i)=>b.setAttribute('aria-pressed',['ring','underline','raised'][i]===treatment))}
const names=['','Unwatchable','Terrible','Bad','Weak','Mediocre','Decent','Good','Great','Excellent','Masterpiece'];const colors=['','#991b1b','#b91c1c','#c2410c','#d97706','#ca8a04','#a3a323','#50a33d','#25a73d','#16b34a','#05b724'];const groups=[['Bad',1,4,3],['Mediocre',5,6,5],['Good',7,8,7],['Excellent',9,10,9]];
function picker(){return '<div class="picker">'+groups.map(([n,l,h,s])=>`<button class="level ${score>=l&&score<=h?'selected':''}" style="grid-column:span ${h-l+1};--c:${colors[s]}" onclick="pick(${s})">${n}<small>${l}–${h}</small></button>`).join('')+Array.from({length:10},(_,i)=>`<button aria-label="${i+1}, ${names[i+1]}" class="number ${score===i+1?'selected':''}" style="--c:${colors[i+1]}" onclick="pick(${i+1})">${i+1}</button>`).join('')+'</div>'}
const nav='<div class="nav"><span class="logo">good<b>watch</b></span><span>Discover &nbsp; · &nbsp; Taste</span></div>';
function status(clear=true){return `<div class="status"><span>${score?'Your score: <strong>'+names[score]+' · '+score+'</strong>':'What did you think?'}</span>${clear?'<button class="clear" onclick="pick(0)">Clear score</button>':''}</div>`}
function dialog(){return `<div class="scene">${nav}<div class="background"><span class="tag">MOVIE · 2024 · SCIENCE FICTION</span><h2>Dune: Part Two</h2><p class="muted">A journey beyond the familiar.</p><div class="pill">✓ Seen &nbsp; | &nbsp; Good · 7</div></div><div class="scrim"></div><div class="panel"><div class="grip"></div><div class="titleline"><h3>Dune: Part Two</h3><span class="seen">✓ Seen</span><button class="close" onclick="this.closest('.panel').style.display='none'" aria-label="Close">×</button></div>${status()}${picker()}<div class="footer"><span>Watched just now. <u>Change date</u></span><span>Rate later</span></div></div></div>`}
function quiz(){return `${nav}<div class="quiz"><div class="art"></div><span class="tag">YOUR TASTE · 3 OF 5 RATED</span><h2>Dune: Part Two</h2><span class="muted">2024 · Science fiction · Adventure</span><p class="question">How did you like it?</p>${picker()}${status(false)}<div class="footer"><button class="secondary">Haven’t seen it</button><span>Skip →</span></div></div>`}
function tv(){return `<div class="tvwrap"><div class="tv"><span class="tag">TASTE · 3 OF 5 RATED</span><h2>How was<br>Dune: Part Two?</h2><p class="muted">2024 · Science fiction</p>${status(false)}${picker()}<div class="footer"><button class="secondary">Haven’t seen it</button><span>⌂ Home</span></div></div><div class="remote">← ↑ ↓ → &nbsp; Navigate &nbsp; · &nbsp; OK to rate</div></div>`}
function pick(n){score=n;render()}function cycle(d){variant=variants[(variants.indexOf(variant)+d+3)%3];history.replaceState(null,'','?variant='+variant+'&treatment='+treatment);render()}
function render(){applyTreatment();if(!variants.includes(variant))variant='dialog';const copy={dialog:['2 · One responsive scoring dialog','The same sheet/dialog for details, cards, My library, Explorer and post-watch prompts.','Phone: a bottom sheet. Desktop: a wider panel anchored near the opener. Contextual footers appear only where relevant.'],quiz:['3a · The standalone Taste quiz','Scoring stays inline, with the same four words and exact-number row.','The real quiz advances after a rating. This preview holds the title so you can compare selected states.'],tv:['3b · The living-room quiz & rating screen','The TV keeps its own frame and remote navigation; phones now get the numeric row too.','“How was it?” uses this same screen, with the existing score and a return to the title. Yellow outline represents remote focus.']};document.getElementById('heading').textContent=copy[variant][0];document.getElementById('intro').textContent=copy[variant][1];document.getElementById('note').textContent=copy[variant][2]+' Mockup only · clicks change local preview state; nothing is saved.';document.getElementById('current').textContent=copy[variant][0];for(const id of ['desktop','phone'])document.getElementById(id).innerHTML=({dialog,quiz,tv})[variant]()}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1)});render();
</script></html>
