</style><main class="compare"><header><small>GoodWatch · Selection treatments</small><h1>Keep the number white.</h1><p>Same score, three ways to mark your selection. Click any number to compare.</p></header><div id="options"></div><p class="hint">All options keep white numerals on a dark fill. Keyboard focus keeps a separate amber outline.<br>Preview only · nothing is saved.</p></main><script>
const variants=['dialog','quiz','tv'];let variant=new URLSearchParams(location.search).get('variant')||'dialog';let score=7;let treatment=new URLSearchParams(location.search).get('treatment')||'ring';function treat(t){treatment=t;const u=new URL(location.href);u.searchParams.set('treatment',t);history.replaceState(null,'',u);render()}function applyTreatment(){document.body.dataset.treatment=treatment;document.querySelectorAll('.treatments button').forEach((b,i)=>b.setAttribute('aria-pressed',['ring','underline','raised'][i]===treatment))}
const names=['','Unwatchable','Terrible','Bad','Weak','Mediocre','Decent','Good','Great','Excellent','Masterpiece'];const colors=['','#991b1b','#b91c1c','#c2410c','#d97706','#ca8a04','#a3a323','#50a33d','#25a73d','#16b34a','#05b724'];const groups=[['Bad',1,4,3],['Mediocre',5,6,5],['Good',7,8,7],['Excellent',9,10,9]];
function picker(){return '<div class="picker">'+groups.map(([n,l,h,s])=>`<button class="level ${score>=l&&score<=h?'selected':''}" style="grid-column:span ${h-l+1};--c:${colors[s]}" onclick="pick(${s})">${n}<small>${l}–${h}</small></button>`).join('')+Array.from({length:10},(_,i)=>`<button aria-label="${i+1}, ${names[i+1]}" class="number ${score===i+1?'selected':''}" style="--c:${colors[i+1]}" onclick="pick(${i+1})">${i+1}</button>`).join('')+'</div>'}

function pick(n){score=n;render()}
function render(){document.getElementById('options').innerHTML=[['ring','A · Colored rim','Recommended · Opus suggested a deep score-colored fill and bright rim, keeping the numeral white.'],['underline','B · Underline','A bright bottom edge marks the selection, with a little less visual weight.'],['raised','C · Raised key','A slight lift and shadow make the selected score feel pressed into place.']].map(([key,title,desc])=>`<section class="option" data-treatment="${key}"><h2>${title}</h2><p>${desc}</p>${picker()}<div class="selected-label">Your score: ${names[score]} · ${score}</div></section>`).join('')};render();</script></html>
