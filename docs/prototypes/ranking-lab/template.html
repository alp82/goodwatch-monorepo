<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking lab</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --fg:#e6e8ee; --dim:#8b93a7; --acc:#6ea8fe; --v:#3ddc97; --t:#f7b955; --warn:#ff6b6b; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 ui-sans-serif,system-ui,sans-serif }
  header { position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line); padding:8px 16px; z-index:2 }
  h1 { font-size:15px; margin:0 0 6px }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 }
  .tabs button { background:#22262f; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; cursor:pointer; font-size:12px }
  .tabs button.on { background:var(--acc); color:#000; border-color:var(--acc) }
  .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:6px 14px; margin-top:6px }
  label { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--dim) }
  label b { color:var(--fg); font-weight:500; min-width:44px; text-align:right }
  select, input[type=range] { width:120px }
  select { background:#22262f; color:var(--fg); border:1px solid var(--line); border-radius:4px }
  main { padding:12px 16px }
  .note { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; color:var(--dim) }
  .note b { color:var(--fg) }
  .meta { color:var(--dim); margin-bottom:8px }
  .watch { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 }
  .watch span { border:1px solid var(--line); border-radius:6px; padding:2px 8px; background:#22262f }
  .watch span em { color:var(--acc); font-style:normal; font-weight:600 }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums }
  th, td { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); white-space:nowrap }
  th { color:var(--dim); font-weight:500; position:sticky; top:0 }
  td.num, th.num { text-align:right }
  tr.hl td { background:#1f2a3a }
  .src { font-weight:600 } .src.V { color:var(--v) } .src.T { color:var(--t) } .src.VT { color:var(--acc) }
  .up { color:var(--v) } .down { color:var(--warn) } .dims { color:var(--dim); font-size:11px }
  .miss { color:var(--warn) } .hit { color:var(--v) }
  @media (max-width:700px) { th:nth-child(n+9), td:nth-child(n+9) { display:none } }
</style>
</head>
<body>
<header>
  <h1>Ranking lab. Re-ranks captured candidate pools in the browser. Throwaway prototype.</h1>
  <div class="tabs" id="presets"></div>
  <div class="tabs" id="queries"></div>
  <div class="controls">
    <label>Strong score min <input type="range" id="strong" min="4" max="9" step="1"><b id="strongV"></b></label>
    <label>Weak score max <input type="range" id="weak" min="1" max="6" step="1"><b id="weakV"></b></label>
    <label>Near-miss credit <input type="range" id="near" min="0" max="1" step="0.1"><b id="nearV"></b></label>
    <label>Primary key <select id="primary"><option value="count">range count</option><option value="sum">weighted sum (normalized)</option><option value="cosine">cosine</option></select></label>
    <label>Tiebreak <select id="tie"><option value="sum">weighted sum</option><option value="cosine">cosine</option><option value="none">none</option></select></label>
    <label>Tiebreak span <input type="range" id="span" min="0" max="12" step="0.05"><b id="spanV"></b></label>
    <label>Tiebreak scale <select id="scale"><option value="possible">possible range for the query</option><option value="pool">observed range in the pool</option></select></label>
    <label>Combine <select id="combine"><option value="textfirst">text pool first, vector fills</option><option value="union">union, evidence additive</option><option value="auto">phrase-aware: union for mood phrase, text first for concrete</option><option value="vector">vector pool only</option><option value="text">text pool only</option><option value="intersect">vector pool, evidence only if in text pool</option></select></label>
    <label>Evidence weight, mood <input type="range" id="evw" min="0" max="2" step="0.1"><b id="evwV"></b></label>
    <label>Evidence weight, concrete <input type="range" id="evwc" min="0" max="2" step="0.1"><b id="evwcV"></b></label>
    <label>Text hits counted (cap) <input type="range" id="textcap" min="1" max="4" step="1"><b id="textcapV"></b></label>
    <label>Evidence cap, mood phrase <input type="range" id="evcap" min="0" max="3" step="0.25"><b id="evcapV"></b></label>
    <label>Evidence cap, concrete phrase <input type="range" id="evcapc" min="0" max="3" step="0.25"><b id="evcapcV"></b></label>
    <label>Vector candidates <select id="cands"><option value="cosine">cosine prefetch 2000 (today)</option><option value="tier">in-range tiers (n, n-1, n-2 hits)</option><option value="both">both</option></select></label>
    <label>Exact keyword (units) <input type="range" id="kwx" min="0" max="2" step="0.1"><b id="kwxV"></b></label>
    <label>Keyword containing the word (units) <input type="range" id="kws" min="0" max="2" step="0.1"><b id="kwsV"></b></label>
    <label>Trope names, rarity-weighted (units) <input type="range" id="trp" min="0" max="2" step="0.1"><b id="trpV"></b></label>
    <label>Genre hint from request words (units) <input type="range" id="gen" min="0" max="2" step="0.1"><b id="genV"></b></label>
    <label>Popularity tiebreak (units) <input type="range" id="pop" min="0" max="1" step="0.05"><b id="popV"></b></label>
    <label>Jev fit, concrete phrase (units per level 0..4) <input type="range" id="jdg" min="0" max="3" step="0.25"><b id="jdgV"></b></label>
    <label>Jev fit, mood phrase (units per level 0..4) <input type="range" id="jdgm" min="0" max="3" step="0.25"><b id="jdgmV"></b></label>
    <label>Rows shown <input type="range" id="rows" min="10" max="100" step="10"><b id="rowsV"></b></label>
  </div>
</header>
<main>
  <div class="note" id="presetNote"></div>
  <div class="meta" id="meta"></div>
  <div class="watch" id="watch"></div>
  <pre id="dump" hidden></pre>
  <table><thead><tr>
    <th class="num">#</th><th>Title</th><th>Src</th><th class="num">Score</th><th class="num">Hits</th><th class="num">Sum</th><th class="num">Cos</th><th class="num">Text</th><th class="num">vs prod</th><th>Dimensions</th>
  </tr></thead><tbody id="body"></tbody></table>
</main>
<script>
const DATA = /*DATA*/;
const JUDGE = /*JUDGE*/;
const WATCH = {
  "complete nonsense": ["Aqua Teen Hunger Force", "Tim and Eric Awesome Show, Great Job!", "The Last Sharknado: It's About Time", "Kung Fu Panda: The Dragon Knight", "Mechanic: Resurrection"],
  "tarkovsky": ["Stalker", "Solaris", "Mirror", "Begotten", "You Won't Be Alone"],
  "feel good cooking show": ["Cooku with Comali", "Somebody Feed Phil", "James May: Oh Cook!", "Home Town", "The Great British Bake Off"],
  "slow burn space horror": ["High Life", "Sputnik", "Alien", "Event Horizon", "Jordskott"],
  "tense heist thriller, not bleak": ["Heat", "Now You See Me", "Inside Man", "Lassiter", "Takers"],
  "grief after losing a child": ["Manchester by the Sea", "Rabbit Hole", "The Missing", "Trial by Fire"],
  "furious": ["The Raid", "Extraction", "Kill", "Fast & Furious"],
  "craty": ["Police Squad!", "The Tom Green Show", "Monty Python's Flying Circus"],
  "melancholy lighthouse keeper mystery": ["The Lighthouse", "The Returned", "Picnic at Hanging Rock", "Platform 7"],
  "scifi with cars": ["Mad Max: Fury Road", "Death Race", "Blade Runner", "Titane", "The Fifth Element", "Cars"],
  "sunglasses at night": ["They Live", "Blade", "The Matrix", "Drive", "Terminator 2: Judgment Day", "Kung Fury"],
  "fantasy with dragons": ["Game of Thrones", "How to Train Your Dragon", "Dragonheart", "Eragon", "The Hobbit: The Desolation of Smaug", "House of the Dragon"],
  "like groundhog day": ["Palm Springs", "Edge of Tomorrow", "Russian Doll", "Happy Death Day", "Groundhog Day", "The Map of Tiny Perfect Things"],
  "time travel complex": ["Primer", "Dark", "Predestination", "Tenet", "12 Monkeys", "Timecrimes"],
};
const GENRE_WORDS = { fantasy: "Fantasy", scifi: "Science Fiction", "sci-fi": "Science Fiction", horror: "Horror", comedy: "Comedy", funny: "Comedy", thriller: "Thriller", crime: "Crime", heist: "Crime", romance: "Romance", romantic: "Romance", mystery: "Mystery", animated: "Animation", animation: "Animation", anime: "Animation", documentary: "Documentary", western: "Western", war: "War", family: "Family", drama: "Drama", action: "Action", adventure: "Adventure", history: "History", historical: "History", musical: "Music", music: "Music" };
const GENRE_MATCH = { "Science Fiction": ["Science Fiction", "Sci-Fi & Fantasy"], Fantasy: ["Fantasy", "Sci-Fi & Fantasy"], Action: ["Action", "Action & Adventure"], Adventure: ["Adventure", "Action & Adventure"], War: ["War", "War & Politics"] };
const genreHints = (cap) => [...new Set(cap.query.toLowerCase().split(/[^a-z-]+/).map((w) => GENRE_WORDS[w]).filter(Boolean))];
const PRESETS = [
  { id: "prod", name: "Production (main)", cfg: { strong: 6, weak: 4, near: 0, primary: "sum", tie: "cosine", span: 0.01, scale: "possible", combine: "textfirst", evw: 0.5, evwc: 0.5, textcap: 4, evcap: 3, evcapc: 3, cands: "cosine", kwx: 0, kws: 0, trp: 0, gen: 0, pop: 0, jdg: 0, jdgm: 0 },
    note: "<b>What main does today.</b> Cosine prefetch of 2000, text pool first, normalized weighted sum plus uncapped essence-text evidence. Keyword and trope evidence only when the text pool is thin (not modelled: those rows appear with zero weight)." },
  { id: "count", name: "Range count 6/4 (branch)", cfg: { strong: 6, weak: 4, near: 0, primary: "count", tie: "sum", span: 0.25, scale: "possible", combine: "textfirst", evw: 0.5, evwc: 0.5, textcap: 4, evcap: 1, evcapc: 1, cands: "cosine", kwx: 0, kws: 0, trp: 0, gen: 0, pop: 0, jdg: 0, jdgm: 0 },
    note: "<b>The prototype branch.</b> Same pools as production, range count first, flat one-unit evidence cap." },
  { id: "leads", name: "Concrete phrase leads", cfg: { strong: 6, weak: 4, near: 0, primary: "count", tie: "sum", span: 0.25, scale: "possible", combine: "textfirst", evw: 0.5, evwc: 1, textcap: 4, evcap: 1, evcapc: 3, cands: "cosine", kwx: 0, kws: 0, trp: 0, gen: 0, pop: 0, jdg: 0, jdgm: 0 },
    note: "<b>Round 2 winner on today's pools.</b> Mood evidence capped at one unit, concrete evidence one unit per text hit up to three." },
  { id: "recall", name: "Leads + tiers + keywords + tropes", cfg: { strong: 6, weak: 4, near: 0, primary: "count", tie: "sum", span: 0.25, scale: "possible", combine: "textfirst", evw: 0.5, evwc: 1, textcap: 4, evcap: 1, evcapc: 3, cands: "both", kwx: 1, kws: 0.5, trp: 0.5, gen: 0, pop: 0, jdg: 0, jdgm: 0 },
    note: "<b>Round 3 direction with structured evidence.</b> Tiers of 2000. An exact keyword is worth one unit, a keyword containing the word half, trope names half a unit weighted by rarity (a trope on 2500 titles counts a tenth of one on 300)." },
  { id: "recallgenre", name: "Recall + genre hint", cfg: { strong: 6, weak: 4, near: 0, primary: "count", tie: "sum", span: 0.25, scale: "possible", combine: "textfirst", evw: 0.5, evwc: 1, textcap: 4, evcap: 1, evcapc: 3, cands: "both", kwx: 1, kws: 0.5, trp: 0.5, gen: 0.5, pop: 0, jdg: 0, jdgm: 0 },
    note: "<b>Same, plus half a unit when a request word names a TMDB genre the title carries.</b> fantasy → Fantasy, scifi → Science Fiction, heist → Crime. Zero cost." },
  { id: "judge", name: "Recall + genre + Jev judge", cfg: { strong: 6, weak: 4, near: 0, primary: "count", tie: "sum", span: 0.25, scale: "possible", combine: "textfirst", evw: 0.5, evwc: 1, textcap: 4, evcap: 1, evcapc: 3, cands: "both", kwx: 1, kws: 0.5, trp: 0.5, gen: 0.5, pop: 0, jdg: 1, jdgm: 1 },
    note: "<b>Jev reads the essence text of the top 40 of production and of recall + genre and scores fit 0..4; one unit per fit level.</b> Titles outside those lists are unjudged and keep their score, which mirrors a production step that judges only the head. About 10 requests per query, in parallel." },
  { id: "winner0", name: "Candidate winner: judge decides concrete, retrieval decides mood", cfg: { strong: 6, weak: 4, near: 0, primary: "count", tie: "sum", span: 0.25, scale: "possible", combine: "textfirst", evw: 0.5, evwc: 1, textcap: 4, evcap: 1, evcapc: 3, cands: "both", kwx: 1, kws: 0.5, trp: 0.5, gen: 0.5, pop: 0, jdg: 3, jdgm: 0 },
    note: "<b>Phrase-aware.</b> For a concrete phrase, Jev's fit decides and retrieval breaks ties. For a mood phrase, no judge: the essence text says little about mood, and the fingerprint already encodes it. The judge then only runs on concrete requests, which also bounds its cost." },
  { id: "winner05", name: "Candidate winner, mood judge at half", cfg: { strong: 6, weak: 4, near: 0, primary: "count", tie: "sum", span: 0.25, scale: "possible", combine: "textfirst", evw: 0.5, evwc: 1, textcap: 4, evcap: 1, evcapc: 3, cands: "both", kwx: 1, kws: 0.5, trp: 0.5, gen: 0.5, pop: 0, jdg: 3, jdgm: 0.5 },
    note: "<b>Same, with the judge as a soft signal on mood phrases.</b> Half a unit per fit level: it can lift a title past one fingerprint hit, not two." },
  { id: "winner1", name: "Candidate winner, mood judge at one", cfg: { strong: 6, weak: 4, near: 0, primary: "count", tie: "sum", span: 0.25, scale: "possible", combine: "textfirst", evw: 0.5, evwc: 1, textcap: 4, evcap: 1, evcapc: 3, cands: "both", kwx: 1, kws: 0.5, trp: 0.5, gen: 0.5, pop: 0, jdg: 3, jdgm: 1 },
    note: "<b>Same, one unit per fit level on mood phrases.</b>" },
  { id: "judgeonly", name: "Jev judge decides (fit first)", cfg: { strong: 6, weak: 4, near: 0, primary: "count", tie: "sum", span: 0.25, scale: "possible", combine: "textfirst", evw: 0.5, evwc: 1, textcap: 4, evcap: 1, evcapc: 3, cands: "both", kwx: 1, kws: 0.5, trp: 0.5, gen: 0.5, pop: 0, jdg: 3, jdgm: 3 },
    note: "<b>Three units per fit level: the judgment dominates and the retrieval score breaks ties.</b> The old prototype's rule." },
];
const $ = (id) => document.getElementById(id);
const ctl = ["strong","weak","near","primary","tie","span","scale","combine","evw","evwc","textcap","evcap","evcapc","cands","kwx","kws","trp","gen","pop","jdg","jdgm","rows"];
let queryIndex = 0, presetId = "prod";
function readCfg() { const c = {}; for (const k of ctl) c[k] = $(k).tagName === "SELECT" ? $(k).value : Number($(k).value); return c; }
function writeCfg(c) { for (const k of ctl) if (k in c) $(k).value = c[k]; }
function fmt(k, v) { return $(k + "V") && ($(k + "V").textContent = v); }

function fingerprint(fp, used, cfg) {
  let hits = 0, ws = 0;
  for (const [key, w] of used) {
    const v = fp[key] ?? 0;
    ws += w * v;
    if (w > 0) { if (v >= cfg.strong) hits += 1; else if (v === cfg.strong - 1) hits += cfg.near; }
    else { if (v <= cfg.weak) hits += 1; else if (v === cfg.weak + 1) hits += cfg.near; }
  }
  return { hits, ws };
}
let currentCap = null;
function rankRows(rows, used, cfg, ctx) {
  // ctx: { wsMin, wsMax, cosMin, cosMax } over the candidate set for normalization
  const sumMin = used.reduce((s, [, w]) => s + Math.min(w, 0) * 10, 0);
  const sumMax = used.reduce((s, [, w]) => s + Math.max(w, 0) * 10, 0);
  const norm = (v, lo, hi) => (hi - lo) ? (v - lo) / (hi - lo) : 0;
  for (const r of rows) {
    const f = fingerprint(r.fp, used, cfg); r.hits = f.hits; r.ws = f.ws;
    let primary, tie = 0;
    if (cfg.primary === "count") primary = r.hits;
    else if (cfg.primary === "sum") primary = norm(r.ws, ctx.wsMin, ctx.wsMax);
    else primary = norm(r.cosine ?? 0, ctx.cosMin, ctx.cosMax);
    if (cfg.tie === "sum") tie = cfg.span * (cfg.scale === "pool" ? norm(r.ws, ctx.wsMin, ctx.wsMax) : norm(r.ws, sumMin, sumMax));
    else if (cfg.tie === "cosine") tie = cfg.span * norm(r.cosine ?? 0, ctx.cosMin, ctx.cosMax);
    r.ev = Math.min((ctx.concrete ? cfg.evwc : cfg.evw) * Math.min(r.text ?? 0, cfg.textcap) + (r.extra ?? 0), ctx.concrete ? cfg.evcapc : cfg.evcap);
    const hints = genreHints(currentCap); const g = currentCap.titles[r.key]?.genres ?? [];
    r.genre = cfg.gen * hints.filter((h) => (GENRE_MATCH[h] ?? [h]).some((name) => g.includes(name))).length;
    const fit = JUDGE[currentCap.query]?.[r.key];
    r.fit = fit == null ? null : fit;
    const votes = currentCap.titles[r.key]?.votes ?? 0;
    r.pop = cfg.pop * Math.min(1, Math.log10(Math.max(votes, 1)) / 7);
    r.base = primary + tie + r.pop + r.genre + (r.fit == null ? 0 : (ctx.concrete ? cfg.jdg : cfg.jdgm) * r.fit);
  }
}
function compute(cap, cfg) {
  const used = cap.used;
  currentCap = cap;
  const vec = new Map(cap.vectorPool.filter((r) => cfg.cands === "both" || r.src === "both" || r.src === cfg.cands).map((r) => [r.key, { ...r, text: 0, inV: true, inT: false }]));
  // 0 = today (keyword and trope evidence only when the text pool is thin); 1 = full weight, always
  // Evidence beyond the essence text: exact keyword, keyword containing the word, trope names weighted by rarity (300 / titles carrying the trope, at most 1 each, sum at most 1)
  const extra = (r) => (r.kwExact.length ? cfg.kwx : 0) + (r.kwSub.length ? cfg.kws : 0) + cfg.trp * Math.min(1, r.tropes.reduce((s, t) => s + Math.min(1, 300 / Math.max(t.df, 1)), 0));
  const txt = new Map(cap.textPool.map((r) => ({ ...r, extra: extra(r) })).filter((r) => r.text > 0 || r.extra > 0).map((r) => [r.key, { ...r, cosine: null, inV: false, inT: true, wider: r.text === 0 }]));
  const all = new Map();
  for (const [k, r] of vec) all.set(k, { ...r });
  for (const [k, r] of txt) { const e = all.get(k); if (e) { e.text = r.text; e.extra = r.extra; e.inT = true; e.wider = r.wider; } else all.set(k, { ...r }); }
  const ctxOf = (rows) => ({ wsMin: Math.min(...rows.map((r) => fingerprint(r.fp, used, cfg).ws)), wsMax: Math.max(...rows.map((r) => fingerprint(r.fp, used, cfg).ws)),
    cosMin: Math.min(...rows.map((r) => r.cosine ?? 0)), cosMax: Math.max(...rows.map((r) => r.cosine ?? 0)), concrete: Boolean(cap.phrases?.[0]?.concrete) });
  const desc = (a, b) => b.score - a.score;
  const concrete = Boolean(cap.phrases?.[0]?.concrete);
  if (cfg.combine === "auto") cfg = { ...cfg, combine: concrete && txt.size ? "textfirst" : "union" };
  let out;
  if (cfg.combine === "vector") { const rows = [...vec.values()]; rankRows(rows, used, cfg, ctxOf(rows)); rows.forEach((r) => r.score = r.base); out = rows.sort(desc); }
  else if (cfg.combine === "text") { const rows = [...txt.values()]; rankRows(rows, used, cfg, ctxOf(rows)); rows.forEach((r) => r.score = r.base + r.ev); out = rows.sort(desc); }
  else if (cfg.combine === "union") { const rows = [...all.values()]; rankRows(rows, used, cfg, ctxOf(rows)); rows.forEach((r) => r.score = r.base + r.ev); out = rows.sort(desc); }
  else if (cfg.combine === "intersect") { const rows = [...vec.values()].map((r) => ({ ...r, text: txt.get(r.key)?.text ?? 0, extra: txt.get(r.key)?.extra ?? 0, inT: txt.has(r.key) })); rankRows(rows, used, cfg, ctxOf(rows)); rows.forEach((r) => r.score = r.base + r.ev); out = rows.sort(desc); }
  else if (cfg.combine === "textfirst") {
    const t = [...txt.values()]; if (t.length) { rankRows(t, used, cfg, ctxOf(t)); t.forEach((r) => r.score = r.base + r.ev); t.sort(desc); }
    const v = [...vec.values()].filter((r) => !txt.has(r.key)); rankRows(v, used, cfg, ctxOf(v.length ? v : [...vec.values()])); v.forEach((r) => r.score = r.base); v.sort(desc);
    out = t.length >= 100 ? t : [...t, ...v];
  }
  return out;
}
let prodRanks = {};
function render() {
  const cap = DATA[queryIndex]; const cfg = readCfg();
  for (const k of ctl) fmt(k, $(k).value);
  const prodCfg = { ...PRESETS[0].cfg, rows: cfg.rows };
  const prod = compute(cap, prodCfg); prodRanks = {}; prod.forEach((r, i) => prodRanks[r.key] = i + 1);
  const rows = compute(cap, cfg);
  const flags = cap.flags.map((f) => `${f.decision}:${f.id}`).join(", ");
  $("meta").innerHTML = `<b>${cap.query}</b> · dimensions: ${cap.used.map(([k, w]) => `${w > 0 ? "+" : "−"}${k}`).join(" ")} · phrases: ${(cap.phrases ?? []).map((p) => `“${p.phrase}” ${p.concrete ? "concrete" : "mood"}`).join(", ") || "none"} · flags: ${flags || "none"} · genre hints: ${genreHints(cap).join(", ") || "none"} · cosine pool 2000 (${cap.vectorMs} ms), tiers ${cap.tiers} (${cap.tierMs} ms) · text pool ${cap.textPool.filter((r) => r.text > 0).length} (${cap.textMs} ms), keyword and trope rows ${cap.textPool.filter((r) => !r.text).length} (${cap.widerMs} ms) · ${cap.tropeMode}`;
  const rankOf = {}; rows.forEach((r, i) => rankOf[r.key] = i + 1);
  const title = (r) => cap.titles[r.key]?.title ?? r.key;
  const watch = WATCH[cap.query] ?? [];
  $("watch").innerHTML = watch.map((w) => { const r = rows.find((x) => title(x) === w); return `<span>${w}: <em>${r ? rankOf[r.key] : "not in pool"}</em>${r ? ` (prod ${prodRanks[r.key] ?? "–"})` : ""}</span>`; }).join("");
  $("dump").textContent = JSON.stringify(rows.slice(0, 60).map((r) => r.key));
  $("body").innerHTML = rows.slice(0, cfg.rows).map((r, i) => {
    const t = title(r), y = cap.titles[r.key]?.year ?? "";
    const p = prodRanks[r.key]; const d = p ? p - (i + 1) : null;
    const dims = cap.used.map(([k, w]) => { const v = r.fp[k] ?? 0; const ok = w > 0 ? v >= cfg.strong : v <= cfg.weak; return `<span class="${ok ? "hit" : "miss"}">${k.slice(0, 8)}=${v}</span>`; }).join(" ");
    return `<tr class="${watch.includes(t) ? "hl" : ""}"><td class="num">${i + 1}</td><td>${t} <span class="dims">${y}</span></td><td class="src ${r.inV && r.inT ? "VT" : r.inV ? "V" : "T"}">${(r.inV ? (r.src === "tier" ? "tier" : "V") : "") + (r.inV && r.inT ? "+" : "") + (r.inT ? (r.wider ? "kw/trope" : "T") : "")}</td><td class="num">${r.score.toFixed(3)}</td><td class="num">${r.hits.toFixed(1)}</td><td class="num">${r.ws.toFixed(1)}</td><td class="num">${r.cosine == null ? "–" : r.cosine.toFixed(3)}</td><td class="num" title="${(r.kwExact ?? []).concat(r.kwSub ?? []).join(", ")} ${(r.tropes ?? []).map((t) => `${t.n} (${t.df})`).join(", ")}">${(r.text ?? 0).toFixed(1)}${r.extra ? "+" + r.extra.toFixed(1) : ""}${r.genre ? " g" : ""}${r.fit != null ? ` <b title="Jev fit 0..4">J${r.fit.toFixed(1)}</b>` : ""}</td><td class="num ${d > 0 ? "up" : d < 0 ? "down" : ""}">${p ? (d > 0 ? "▲" + d : d < 0 ? "▼" + -d : "=") : "new"}</td><td class="dims">${dims}</td></tr>`;
  }).join("");
}
function applyPreset(id) { presetId = id; const p = PRESETS.find((x) => x.id === id); writeCfg(p.cfg); $("presetNote").innerHTML = p.note; document.querySelectorAll("#presets button").forEach((b) => b.classList.toggle("on", b.dataset.id === id)); render(); }
$("presets").innerHTML = PRESETS.map((p) => `<button data-id="${p.id}">${p.name}</button>`).join("");
$("queries").innerHTML = DATA.map((c, i) => `<button data-i="${i}">${c.query}</button>`).join("");
$("presets").onclick = (e) => e.target.dataset.id && applyPreset(e.target.dataset.id);
$("queries").onclick = (e) => { if (!e.target.dataset.i) return; queryIndex = Number(e.target.dataset.i); document.querySelectorAll("#queries button").forEach((b) => b.classList.toggle("on", b.dataset.i == queryIndex)); render(); };
for (const k of ctl) $(k).addEventListener("input", () => { document.querySelectorAll("#presets button").forEach((b) => b.classList.remove("on")); $("presetNote").innerHTML = "<b>Custom.</b> Controls changed from the last preset."; render(); });
$("rows").value = 30;
// Deep links: ?q=<query index>&preset=<id>
const params = new URLSearchParams(location.search);
queryIndex = Math.min(DATA.length - 1, Number(params.get("q") ?? 0));
document.querySelectorAll("#queries button")[queryIndex].classList.add("on");
applyPreset(PRESETS.some((p) => p.id === params.get("preset")) ? params.get("preset") : "prod");
</script>
