---
# The daily `killall -9 windmill` worked around old memory leaks. It killed every
# running job at 21:31 and made schedules re-run, so it is removed. The entry is
# matched by its name, which must stay unchanged for the removal to work.
- name: Remove the daily Windmill kill cron job
  hosts: all
  become: yes
  tasks:
    - name: "Cron: remove the daily Windmill kill"
      cron:
        name: "Kill windmill process every 24 hours"
        state: absent

- name: Configure Backup Cron Job for CrateDB
  hosts: db1
  become: yes
  tasks:
    # Set both in the db1 inventory only after the dedicated user and protected
    # password file exist. Unset keeps the existing credentialless cron unchanged.
    - name: Validate optional CrateDB backup credentials
      assert:
        that:
          - (crate_backup_user | default('') | length > 0) == (crate_backup_password_file | default('') | length > 0)
        fail_msg: "Set crate_backup_user and crate_backup_password_file together"

    - name: "Cron: CrateDB Backup (Hourly at :05)"
      cron:
        name: "CrateDB Backup"
        minute: "5"
        hour: "*"
        job: "{{ ('CRATE_BACKUP_USER=' ~ (crate_backup_user | quote) ~ ' CRATE_BACKUP_PASSWORD_FILE=' ~ (crate_backup_password_file | quote) ~ ' ') if (crate_backup_user | default('') | length > 0) else '' }}/root/.local/bin/uv run /root/goodwatch/goodwatch-monorepo/goodwatch-crate/backup.py >> /var/log/backup_crate.log 2>&1"

- name: Configure Backup Cron Job for Qdrant
  hosts: vector1
  become: yes
  tasks:
    - name: "Cron: Qdrant Backup (Hourly at :15)"
      cron:
        name: "Qdrant Backup"
        minute: "15"
        hour: "*"
        job: "/root/.local/bin/uv run /root/goodwatch/goodwatch-monorepo/goodwatch-qdrant/backup.py >> /var/log/backup_qdrant.log 2>&1"