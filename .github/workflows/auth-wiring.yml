name: Better Auth webapp wiring

on:
  pull_request:
    paths:
      - 'goodwatch-webapp/app/server/auth/**'
      - 'goodwatch-webapp/app/utils/auth*.ts'
      - 'goodwatch-webapp/app/routes/api.auth.*'
      - 'goodwatch-webapp/app/entry.server.tsx'
      - 'goodwatch-webapp/scripts/auth-wiring/**'
      - 'goodwatch-webapp/scripts/auth-maintenance/**'
      - 'goodwatch-webapp/package*.json'
      - 'goodwatch-webapp/packages/auth-stack/**'
      - 'goodwatch-webapp/scripts/auth-mcp/**'
      - 'goodwatch-webapp/.npmrc'
      - '.github/workflows/auth-wiring.yml'
  push:
    branches: [main]
    paths:
      - 'goodwatch-webapp/app/server/auth/**'
      - 'goodwatch-webapp/app/utils/auth*.ts'
      - 'goodwatch-webapp/app/routes/api.auth.*'
      - 'goodwatch-webapp/app/entry.server.tsx'
      - 'goodwatch-webapp/scripts/auth-wiring/**'
      - 'goodwatch-webapp/scripts/auth-maintenance/**'
      - 'goodwatch-webapp/package*.json'
      - 'goodwatch-webapp/packages/auth-stack/**'
      - 'goodwatch-webapp/scripts/auth-mcp/**'
      - 'goodwatch-webapp/.npmrc'
      - '.github/workflows/auth-wiring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: goodwatch-webapp
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix scripts/auth-cratedb/conformance
      - name: Configure disposable runner for CrateDB
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Auth and MCP HTTP flows with local CrateDB, Valkey and SMTP only
        working-directory: goodwatch-webapp
        run: npm run test:auth:maintenance
      - name: Keep test and container evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auth-wiring-results
          path: |
            goodwatch-webapp/scripts/auth-maintenance/results/integration.log
            goodwatch-webapp/scripts/auth-maintenance/results/typecheck.log
            goodwatch-webapp/scripts/auth-maintenance/results/containers.log
