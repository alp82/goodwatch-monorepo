name: Better Auth maintenance and safety

on:
  pull_request:
    paths:
      - 'goodwatch-webapp/app/server/auth/**'
      - 'goodwatch-webapp/scripts/auth-maintenance/**'
      - 'goodwatch-webapp/scripts/auth-cratedb/**'
      - 'goodwatch-webapp/scripts/auth-mcp/**'
      - 'goodwatch-webapp/scripts/auth-integration/**'
      - 'goodwatch-webapp/app/server/web-fetch-gaps.server.ts'
      - 'goodwatch-webapp/packages/auth-stack/**'
      - 'goodwatch-webapp/package*.json'
      - 'goodwatch-webapp/.env.example'
      - '.github/workflows/auth-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: goodwatch-webapp
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix scripts/auth-cratedb/conformance
      - name: Configure disposable runner for CrateDB
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Test maintenance and auth with local Docker stores only
        working-directory: goodwatch-webapp
        run: NODE_OPTIONS="--import=$PWD/scripts/auth-integration/web-fetch.mjs" npm run test:auth:maintenance
      - name: Keep sanitized test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auth-maintenance-results
          path: goodwatch-webapp/scripts/auth-maintenance/results/
