name: YepWatch gate and deploy

# Deploy gate for YepWatch (docs/yepwatch-e2e-pipeline.md). On a push to main that touches what the YepWatch
# images build from, in parallel: unit/type checks, the web E2E gate (Playwright, sharded) and the Android
# E2E gate (emulator with KVM). Only when all pass does the deploy job ask Coolify to deploy, wait for it,
# and run the production smoke.
#
# Hermetic: the gate jobs hold no secrets, the stack binds to loopback and refuses non-loopback sockets
# (e2e/stack/block-egress.mjs), the APK only knows loopback origins, and the production hosts are pointed at
# 0.0.0.0 on the runner as a second fence. Only `deploy` (COOLIFY_YEPWATCH_TOKEN, environment
# yepwatch-production) and the smoke (member credentials, environment yepwatch-smoke) see secrets.

on:
  push:
    branches: [main]
    paths:
      # Keep in sync with the Coolify application's watch paths and e2e/ci/coolify-deploy.mjs WATCH.
      - "yepwatch-app/**"
      - "yepwatch-realtime/**"
      - "goodwatch-webapp/app/server/yepwatch/**"
      - "goodwatch-webapp/packages/yepwatch-contracts/**"
      # Shared webapp code the API image and the E2E API bundle compile in (e2e/stack/build.mjs buildApi).
      - "goodwatch-webapp/app/server/**"
      - "goodwatch-webapp/app/utils/**"
      - "goodwatch-webapp/package-lock.json"
      - "goodwatch-webapp/patches/**"
      - ".github/workflows/yepwatch-gate.yml"
      - ".github/workflows/yepwatch-smoke.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy when the gate passes (needs vars.YEPWATCH_DEPLOY_VIA_CI == 'true')
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One gate per commit; a newer push doesn't cancel an older gate (its deploy stands down by itself when
  # a newer YepWatch commit is on main, see coolify-deploy.mjs).
  group: yepwatch-gate-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  WEB_SHARDS: 6
  # Frame pacing (60 fps, no frame > 20 ms): enforced on web with one Playwright worker per shard; reported
  # without gating on Android (SwiftShader, no GPU). See docs/yepwatch-e2e-pipeline.md.
  WEB_FRAMES: gate
  NATIVE_FRAMES: report

jobs:
  checks:
    name: Unit and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            yepwatch-app
            yepwatch-realtime
            goodwatch-webapp/packages
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Restore node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: |
            yepwatch-app/node_modules
            yepwatch-realtime/node_modules
          key: yw-nm-checks-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('yepwatch-app/package-lock.json', 'yepwatch-realtime/package-lock.json') }}
      - name: Install (cache miss only)
        if: steps.nm.outputs.cache-hit != 'true'
        run: |
          npm --prefix yepwatch-app ci --install-links --no-audit --no-fund &
          npm --prefix yepwatch-realtime ci --no-audit --no-fund &
          wait
      - name: Typecheck, lint, unit tests, gateway build + tests
        run: |
          set -e
          npm --prefix yepwatch-app run typecheck > typecheck.log 2>&1 & p1=$!
          npm --prefix yepwatch-app run lint > lint.log 2>&1 & p2=$!
          npm --prefix yepwatch-app test > unit.log 2>&1 & p3=$!
          (npm --prefix yepwatch-realtime run build && npm --prefix yepwatch-realtime test) > realtime.log 2>&1 & p4=$!
          status=0
          for p in "$p1:typecheck" "$p2:lint" "$p3:unit" "$p4:realtime"; do
            if wait "${p%%:*}"; then echo "${p#*:} ok"; else echo "::error::${p#*:} failed"; cat "${p#*:}.log"; status=1; fi
          done
          exit $status

  web-gate:
    name: Web gate ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            yepwatch-app
            yepwatch-realtime
            goodwatch-webapp
      - name: Fence off production hosts
        run: echo "0.0.0.0 yepwatch.com www.yepwatch.com goodwatch.app www.goodwatch.app coolify.goodwatch.app" | sudo tee -a /etc/hosts
      - name: Pull stack images in the background
        run: |
          (for i in valkey/valkey:8 crate:6.4.6 caddy:2.11.7; do docker pull -q "$i" & done; wait) > "$RUNNER_TEMP/pull.log" 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Restore node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: |
            goodwatch-webapp/node_modules
            yepwatch-app/node_modules
            yepwatch-realtime/node_modules
            yepwatch-app/e2e/node_modules
          key: yw-nm-e2e-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('goodwatch-webapp/package-lock.json', 'goodwatch-webapp/patches/**', 'yepwatch-app/package-lock.json', 'yepwatch-realtime/package-lock.json', 'yepwatch-app/e2e/package-lock.json') }}
      - name: Install (cache miss only)
        if: steps.nm.outputs.cache-hit != 'true'
        run: |
          (cd goodwatch-webapp && npm ci --ignore-scripts --no-audit --no-fund && npx patch-package) &
          npm --prefix yepwatch-app ci --install-links --no-audit --no-fund &
          npm --prefix yepwatch-realtime ci --no-audit --no-fund &
          npm --prefix yepwatch-app/e2e ci --no-audit --no-fund &
          wait
      - name: Cache keys
        id: keys
        run: node yepwatch-app/e2e/ci/cache-keys.mjs playwright
      - name: Restore Playwright Chromium
        id: pw
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: yw-pw-${{ runner.os }}-${{ steps.keys.outputs.playwright }}
      - name: Install Chromium (cache miss only)
        if: steps.pw.outputs.cache-hit != 'true'
        working-directory: yepwatch-app
        run: npx playwright install chromium
      - name: Restore Metro cache
        uses: actions/cache@v6
        with:
          path: /tmp/metro-cache
          key: yw-metro-web-${{ hashFiles('yepwatch-app/package-lock.json') }}-${{ github.sha }}
          restore-keys: yw-metro-web-${{ hashFiles('yepwatch-app/package-lock.json') }}-
      - name: Wait for stack images
        run: |
          for i in valkey/valkey:8 crate:6.4.6 caddy:2.11.7; do
            until docker image inspect "$i" > /dev/null 2>&1; do sleep 1; done
          done
      - name: E2E gate, shard ${{ matrix.shard }}/${{ env.WEB_SHARDS }}
        id: gate
        working-directory: yepwatch-app/e2e
        env:
          # One test at a time per runner: frame pacing is judged on an otherwise idle 4-vCPU machine.
          E2E_WORKERS: '1'
        run: |
          start=$(date +%s)
          set +e
          node run.mjs gate -- --shard=${{ matrix.shard }}/${{ env.WEB_SHARDS }}
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "Web shard ${{ matrix.shard }}: tier exit $code, $(( $(date +%s) - start )) s for stack + tests" >> "$GITHUB_STEP_SUMMARY"
          # The verdict is web-gate-verdict's (it merges all shards); a shard fails here only without a report.
          test -f artifacts/gate/report.json
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-gate-${{ matrix.shard }}
          path: |
            yepwatch-app/e2e/artifacts/gate/report.json
            yepwatch-app/e2e/artifacts/gate/summary.md
            yepwatch-app/e2e/artifacts/gate/results-*/**/*.zip
            yepwatch-app/e2e/artifacts/gate/results-*/**/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Stack logs on failure
        if: failure() || steps.gate.outputs.exit != '0'
        run: tail -n 60 yepwatch-app/e2e/.cache/logs/*.log yepwatch-app/e2e/.cache/supervisor.out 2>/dev/null || true

  web-gate-verdict:
    name: Web gate verdict
    needs: web-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: yepwatch-app/e2e
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: web-gate-*
          path: shards
      - name: Merge shards and judge
        run: node yepwatch-app/e2e/ci/merge-reports.mjs shards --out merged --expect ${{ env.WEB_SHARDS }} --frames=${{ env.WEB_FRAMES }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-gate-merged
          path: merged
          retention-days: 14

  android-gate:
    # Owner decision Q28: one mixed room on one emulator (Android app host + browser friend: create/join,
    # Start, vote to a match) plus the Android cold start. The two-phone and full Android runs stay in the
    # pre-OTA gate (e2e/ci/ota-gate.mjs). Budget: the whole workflow under 4 min, so the slow parts overlap:
    # the stack and the APK repack start in the background as soon as node_modules are back, while the
    # emulator, system image and AVD caches download.
    name: Android gate (mixed room)
    runs-on: ubuntu-latest
    # A warm run takes ~4 min. A cold one (no APK base, Gradle, SDK or AVD cache) builds the release APK and the
    # emulator snapshot from scratch, which takes longer; its caches are saved even when the gate fails (below), so
    # it happens once per native key.
    timeout-minutes: 30
    env:
      YW_E2E_HOME: /home/runner/.cache/yw-e2e-native
      YW_E2E_RUNS: /home/runner/.cache/yw-e2e-runs
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      YW_E2E_SHUTDOWN: '1'
      # No GPU on GitHub runners: software rendering. Snapshots are saved and loaded with the same mode.
      YW_E2E_GPU: swiftshader_indirect
      MAESTRO_VERSION: 2.12.1
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            yepwatch-app
            yepwatch-realtime
            goodwatch-webapp
      - name: Fence off production hosts
        run: echo "0.0.0.0 yepwatch.com www.yepwatch.com goodwatch.app www.goodwatch.app coolify.goodwatch.app" | sudo tee -a /etc/hosts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Pull stack images in the background
        # pull.status gets the pull's exit status (0 = every image pulled); the background preparation waits
        # for it (native-gate.mjs --pulled), so a failed pull fails the gate instead of stalling it.
        run: |
          (
            pids=()
            for i in valkey/valkey:8 crate:6.4.6 caddy:2.11.7; do docker pull -q "$i" & pids+=($!); done
            status=0
            for p in "${pids[@]}"; do wait "$p" || status=1; done
            echo "$status" > "$RUNNER_TEMP/pull.status.tmp" && mv "$RUNNER_TEMP/pull.status.tmp" "$RUNNER_TEMP/pull.status"
          ) > "$RUNNER_TEMP/pull.log" 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore node_modules
        id: nm
        uses: actions/cache@v6
        with:
          path: |
            goodwatch-webapp/node_modules
            yepwatch-app/node_modules
            yepwatch-realtime/node_modules
            yepwatch-app/e2e/node_modules
          key: yw-nm-e2e-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('goodwatch-webapp/package-lock.json', 'goodwatch-webapp/patches/**', 'yepwatch-app/package-lock.json', 'yepwatch-realtime/package-lock.json', 'yepwatch-app/e2e/package-lock.json') }}
      - name: Install (cache miss only)
        if: steps.nm.outputs.cache-hit != 'true'
        run: |
          (cd goodwatch-webapp && npm ci --ignore-scripts --no-audit --no-fund && npx patch-package) &
          npm --prefix yepwatch-app ci --install-links --no-audit --no-fund &
          npm --prefix yepwatch-realtime ci --no-audit --no-fund &
          npm --prefix yepwatch-app/e2e ci --no-audit --no-fund &
          wait
      - name: Cache keys
        id: keys
        run: |
          node yepwatch-app/e2e/ci/cache-keys.mjs native_key cpu playwright
          echo "emulator=$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/emulator/source.properties" 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - name: Restore release APK base
        # Keyed by the harness's native key (lockfile, app config, plugins, assets): a JS-only change reuses
        # this Gradle-built APK and only swaps in a freshly bundled index.android.bundle (lib/build.mjs).
        id: apk
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.YW_E2E_HOME }}/apk/${{ steps.keys.outputs.native_key }}/base*
          key: yw-apk-base-${{ steps.keys.outputs.native_key }}
      - name: Restore Gradle (cold native builds only)
        id: gradle
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.YW_E2E_HOME }}/gradle/caches/modules-2
            ${{ env.YW_E2E_HOME }}/gradle/wrapper
          key: yw-gradle-${{ hashFiles('yepwatch-app/package-lock.json') }}
          restore-keys: yw-gradle-
      - name: Restore Metro caches (web export + APK bundle)
        # The APK's Metro cache sits in a directory per build-time env (loopback origins), so it only ever
        # serves the bundle it was filled for; the web export uses /tmp/metro-cache.
        id: metro
        uses: actions/cache/restore@v6
        with:
          path: |
            /tmp/metro-cache
            ${{ env.YW_E2E_HOME }}/metro
          key: yw-metro-android-${{ hashFiles('yepwatch-app/package-lock.json') }}-${{ github.sha }}
          restore-keys: yw-metro-android-${{ hashFiles('yepwatch-app/package-lock.json') }}-
      - name: Restore Playwright Chromium (the browser friend)
        id: pw
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: yw-pw-${{ runner.os }}-${{ steps.keys.outputs.playwright }}
      - name: Install Chromium (cache miss only)
        if: steps.pw.outputs.cache-hit != 'true'
        working-directory: yepwatch-app
        run: npx playwright install chromium
      - name: Stack + APK in the background
        # Waits for the image pull (failing on a failed one), then brings the stack up and builds the APK
        # (cached base + JS repack) while the next steps download the Android caches. Bounded below the job
        # deadline (native-gate.mjs PULL_MS, PREPARE_MS); the gate step waits for $RUNNER_TEMP/prepare.json.
        working-directory: yepwatch-app/e2e
        env:
          # A cold release build (no APK base cache) gets 20 min instead of 7.
          YW_E2E_PREPARE_MS: ${{ steps.apk.outputs.cache-hit == 'true' && '420000' || '1200000' }}
        run: |
          nohup node ci/native-gate.mjs --prepare="$RUNNER_TEMP/prepare.json" --pulled="$RUNNER_TEMP/pull.status" \
            > "$RUNNER_TEMP/prepare.log" 2>&1 &
      - name: Restore Android emulator + system image
        id: sdk
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/system-images/android-35/google_apis/x86_64
          key: yw-sdk-${{ runner.os }}-api35-google_apis-x86_64-v1
      - name: Install emulator + system image (cache miss only)
        id: sdk_install
        if: steps.sdk.outputs.cache-hit != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator "$SYSTEM_IMAGE" > /dev/null
      - name: Restore Maestro
        id: maestro
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.YW_E2E_HOME }}/tools/maestro
          key: yw-maestro-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro (cache miss only)
        id: maestro_install
        if: steps.maestro.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$YW_E2E_HOME/tools"
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$YW_E2E_HOME/tools"
      - name: Restore AVD + snapshot
        # A snapshot only loads on the CPU model and emulator build that saved it. default_boot (the
        # emulator's own quick-boot image, ~1.3 GB) is never loaded by the harness, so it stays out.
        id: avd
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.YW_E2E_HOME }}/avd
            !${{ env.YW_E2E_HOME }}/avd/yw-e2e.avd/snapshots/default_boot
          key: yw-avd-v2-${{ steps.keys.outputs.cpu }}-emu${{ steps.keys.outputs.emulator }}-${{ hashFiles('yepwatch-app/e2e/native/lib/device.mjs') }}
      - name: Install ffmpeg (the flash gate reads the screen recording's frames)
        # The runner image ships no ffmpeg; native/lib/video.mjs decodes each scenario's recording with it. The
        # background preparation keeps building meanwhile.
        run: command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null; }
      - name: Android E2E gate (cold start + mixed room)
        working-directory: yepwatch-app/e2e
        env:
          YW_E2E_PREPARE_MS: ${{ steps.apk.outputs.cache-hit == 'true' && '420000' || '1200000' }}
        run: node ci/native-gate.mjs --mode=subset --frames=${{ env.NATIVE_FRAMES }} --after-prepare="$RUNNER_TEMP/prepare.json"
      - name: Background pull + stack + APK logs
        if: always()
        run: |
          echo "::group::image pull log"; cat "$RUNNER_TEMP/pull.log" 2>/dev/null; echo "::endgroup::"
          echo "::group::background stack + APK log"; cat "$RUNNER_TEMP/prepare.log" 2>/dev/null; echo "::endgroup::"
      - name: Stop the emulator (before the AVD cache is saved)
        id: stopped
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5570 emu kill > /dev/null 2>&1 || true
          # The AVD is saved only once the emulator process is gone (it writes the AVD until it exits).
          pid=$(cat "$YW_E2E_HOME/emulator-5570.pid" 2>/dev/null || true)
          for i in $(seq 1 60); do { [ -z "$pid" ] || ! kill -0 "$pid" 2>/dev/null; } && break; sleep 0.5; done
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then echo "emulator=running" >> "$GITHUB_OUTPUT"; else echo "emulator=stopped" >> "$GITHUB_OUTPUT"; fi
      - name: Wait for the background preparation (before its caches are saved)
        # The background --prepare process (Gradle, Metro) may still be writing when an earlier step failed: wait for
        # its outcome, then stop Gradle's daemon so nothing writes into its cache while it is saved.
        id: prepared
        if: always()
        run: |
          for i in $(seq 1 1300); do
            [ -f "$RUNNER_TEMP/prepare.json" ] && break
            pid=$(cat "$RUNNER_TEMP/prepare.json.pid" 2>/dev/null || true)
            [ -n "$pid" ] && ! kill -0 "$pid" 2>/dev/null && break
            [ -z "$pid" ] && [ $i -gt 4 ] && break
            sleep 1
          done
          ok=$(node -e 'try { console.log(require(process.argv[1]).ok === true) } catch { console.log(false) }' "$RUNNER_TEMP/prepare.json")
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          pkill -f GradleDaemon > /dev/null 2>&1 || true
          sleep 2
      - name: What the run built (for the cache saves below)
        # Saved even when the gate fails, so a cold run's slow work (the release APK, Gradle's downloads, the SDK, the
        # emulator snapshot) is done once; only what finished is saved: the APK, Gradle and Metro after a successful
        # background preparation, Maestro after its install step passed, the AVD with the harness's own snapshot
        # marker (written after a save without KO) once the emulator has exited.
        id: built
        if: always()
        run: |
          has() { [ -e "$1" ] && echo true || echo false; }
          echo "apk=$(has "$YW_E2E_HOME/apk/${{ steps.keys.outputs.native_key }}/base.json")" >> "$GITHUB_OUTPUT"
          echo "gradle=$(has "$YW_E2E_HOME/gradle/caches/modules-2")" >> "$GITHUB_OUTPUT"
          echo "avd=$(has "$YW_E2E_HOME/avd/yw-e2e.avd/snapshots/yw-base-v2/yw-saved.json")" >> "$GITHUB_OUTPUT"
      - name: Save release APK base
        if: always() && steps.apk.outputs.cache-hit != 'true' && steps.prepared.outputs.ok == 'true' && steps.built.outputs.apk == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.YW_E2E_HOME }}/apk/${{ steps.keys.outputs.native_key }}/base*
          key: ${{ steps.apk.outputs.cache-primary-key }}
      - name: Save Gradle
        if: always() && steps.gradle.outcome == 'success' && steps.gradle.outputs.cache-hit != 'true' && steps.prepared.outputs.ok == 'true' && steps.built.outputs.gradle == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.YW_E2E_HOME }}/gradle/caches/modules-2
            ${{ env.YW_E2E_HOME }}/gradle/wrapper
          key: ${{ steps.gradle.outputs.cache-primary-key }}
      - name: Save Metro caches
        if: always() && steps.metro.outputs.cache-hit != 'true' && steps.prepared.outputs.ok == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /tmp/metro-cache
            ${{ env.YW_E2E_HOME }}/metro
          key: ${{ steps.metro.outputs.cache-primary-key }}
      - name: Save Android emulator + system image
        if: always() && steps.sdk_install.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/system-images/android-35/google_apis/x86_64
          key: ${{ steps.sdk.outputs.cache-primary-key }}
      - name: Save Maestro
        if: always() && steps.maestro_install.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.YW_E2E_HOME }}/tools/maestro
          key: ${{ steps.maestro.outputs.cache-primary-key }}
      - name: Save AVD + snapshot
        if: always() && steps.avd.outputs.cache-hit != 'true' && steps.stopped.outputs.emulator == 'stopped' && steps.built.outputs.avd == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.YW_E2E_HOME }}/avd
            !${{ env.YW_E2E_HOME }}/avd/yw-e2e.avd/snapshots/default_boot
          key: ${{ steps.avd.outputs.cache-primary-key }}
      - name: Upload run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-gate
          path: |
            ${{ env.YW_E2E_RUNS }}/**/result.json
            ${{ env.YW_E2E_RUNS }}/**/ci-summary.md
            ${{ env.YW_E2E_RUNS }}/**/*.png
            ${{ env.YW_E2E_RUNS }}/**/logcat-*.txt
            ${{ env.YW_E2E_HOME }}/logs/*.log
            ${{ runner.temp }}/prepare.log
            ${{ runner.temp }}/pull.log
          retention-days: 14
          if-no-files-found: warn
      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-gate-videos
          path: ${{ env.YW_E2E_RUNS }}/**/video/**
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy via Coolify
    needs: [checks, web-gate-verdict, android-gate]
    # Stays off until the owner switches deploys from the Coolify webhook to this pipeline (vars.YEPWATCH_DEPLOY_VIA_CI).
    if: >-
      vars.YEPWATCH_DEPLOY_VIA_CI == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: yepwatch-production
      url: https://yepwatch.com
    concurrency:
      group: yepwatch-deploy
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: yepwatch-app/e2e/ci
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Deploy, wait for the swap, wait for readiness
        id: deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_YEPWATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node yepwatch-app/e2e/ci/coolify-deploy.mjs --sha "$GITHUB_SHA"

  smoke:
    name: Production smoke after deploy
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/yepwatch-smoke.yml
    with:
      reason: after deploy ${{ github.sha }}
    secrets: inherit
