name: YepWatch images

on:
  workflow_dispatch:
  push:
    branches: [feat/yepwatch-shared-services]
    paths:
      - 'goodwatch-webapp/**'
      - 'yepwatch-app/**'
      - 'yepwatch-realtime/**'
      - '.github/workflows/yepwatch-release.yml'

permissions:
  contents: read

concurrency:
  group: yepwatch-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          npm --prefix goodwatch-webapp ci --no-audit --no-fund
          npm --prefix yepwatch-app ci --install-links --no-audit --no-fund
          npm --prefix yepwatch-realtime ci --no-audit --no-fund
      - name: Validate client and gateway
        run: |
          npm --prefix yepwatch-app run typecheck
          npm --prefix yepwatch-app run lint
          npm --prefix yepwatch-app test
          npm --prefix yepwatch-realtime run build
          npm --prefix yepwatch-realtime test
      - name: Validate typed storage and concurrency on disposable Crate
        working-directory: goodwatch-webapp
        env:
          YEPWATCH_TEST_CONTROL_CRATE: '1'
          YEPWATCH_TEST_RELATIONAL_CRATE: '1'
        run: |
          node --experimental-strip-types --test \
            app/server/yepwatch/proposal.test.ts \
            app/server/yepwatch/proposal-release.test.ts \
            app/server/yepwatch/proposal-release-members.test.ts \
            app/server/yepwatch/proposal-release-control.test.ts \
            app/server/yepwatch/proposal-release-control-crate.test.ts \
            app/server/yepwatch/proposal-relational-crate.test.ts
          node app/server/yepwatch/write-storage-schema.mjs
          git diff --exit-code -- app/server/yepwatch/schema.sql
      - name: Build commit-tagged images
        env:
          CI: '1'
          RELEASE_OUTPUT: ${{ runner.temp }}/yepwatch-release
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/yepwatch
        run: bash yepwatch-realtime/release/build-images.sh
      - name: Publish images (does not deploy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          RELEASE_OUTPUT: ${{ runner.temp }}/yepwatch-release
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          : > "$RELEASE_OUTPUT/published-images.env"
          for service in api gateway front; do
            image=$(cat "$RELEASE_OUTPUT/$service.image")
            docker push "$image"
            digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
            printf 'YEPWATCH_%s_IMAGE=%s\n' "${service^^}" "$digest" >> "$RELEASE_OUTPUT/published-images.env"
          done
          printf 'YEPWATCH_SOURCE_COMMIT=%s\n' "$GITHUB_SHA" >> "$RELEASE_OUTPUT/published-images.env"
          cat "$RELEASE_OUTPUT/published-images.env" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact deployment inputs
        uses: actions/upload-artifact@v7
        with:
          name: yepwatch-deployment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/yepwatch-release/published-images.env
            ${{ runner.temp }}/yepwatch-release/images.json
            ${{ runner.temp }}/yepwatch-release/context/manifest.json
            yepwatch-realtime/release/compose.yaml
            yepwatch-realtime/release/compose.coolify.yaml
            yepwatch-realtime/release/release.env.example
            yepwatch-realtime/release/api.env.example
            yepwatch-realtime/release/DEPLOY.md
            goodwatch-webapp/app/server/yepwatch/schema.sql
